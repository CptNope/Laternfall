# Desktop builds (Tauri): a native window around the same single index.html.
# - Pull requests that touch the desktop build: Linux only, as a compile check.
# - Version tags (v*) and manual runs: Windows, macOS (universal) and Linux.
#   On a tag the installers are attached to that tag's GitHub Release.
name: Desktop builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths: ['src-tauri/**', '.github/workflows/desktop.yml', 'tools/make_icons.py', 'icons/**']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-22.04"]') || fromJSON('["ubuntu-22.04", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux webview libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stage the game and make the app icons
        shell: bash
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest dist/
          cp -r icons dist/
          npx --yes @tauri-apps/cli@2 icon icons/icon-1024.png -o src-tauri/icons

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ startsWith(matrix.os, 'macos') && '--target universal-apple-darwin' || '' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Lanternfall {0}', github.ref_name) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: lanternfall-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: ignore
          retention-days: 14
