# Builds the game, checks index.html is up to date, and plays it headlessly.
# The run fails on any JavaScript error. Screenshots are kept as an artifact.
name: Play-test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Playwright
        run: pip install playwright && playwright install --with-deps chromium
      - name: Build, and check index.html matches src/
        run: python3 build.py && git diff --exit-code index.html
      - name: Check the game guide matches src/data.js
        run: python3 tools/gentables.py && git diff --exit-code docs/GAME_GUIDE.md
      - name: Play-test
        run: python3 tools/playtest.py index.html shots chapter systems newgame comfort hearts depth drowned
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playtest-screenshots, path: shots }
