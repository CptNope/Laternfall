<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lanternfall — A Tale of the Four Flames</title>
<style>
html,body{margin:0;height:100%;background:#05040c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:auto;box-shadow:0 0 60px rgba(120,90,200,.25)}
#touch{display:none;position:fixed;inset:0;pointer-events:none}
#touch .b{position:absolute;pointer-events:auto;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);color:rgba(255,255,255,.8);font:bold 18px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;border-radius:12px;touch-action:none}
#touch .b.on{background:rgba(255,255,255,.35)}
#touch .d{width:54px;height:54px}
#touch .r{width:66px;height:66px;border-radius:50%}
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<div id="touch">
  <div class="b d" data-a="up" style="left:70px;bottom:136px">▲</div>
  <div class="b d" data-a="left" style="left:14px;bottom:80px">◀</div>
  <div class="b d" data-a="right" style="left:126px;bottom:80px">▶</div>
  <div class="b d" data-a="down" style="left:70px;bottom:24px">▼</div>
  <div class="b r" data-a="ok" style="right:20px;bottom:90px">A</div>
  <div class="b r" data-a="cancel" style="right:96px;bottom:40px">B</div>
</div>
<script>
'use strict';
// ============================================================
//  LANTERNFALL — core: canvas, utils, input, UI, scripting, audio
// ============================================================
const W = 640, H = 480, TS = 32, VW = 20, VH = 15;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let SCALE = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  SCALE = s;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.round(W * s * DPR);
  cv.height = Math.round(H * s * DPR);
}
window.addEventListener('resize', resize);
resize();

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function hash(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
}
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function weighted(list, r = Math.random()) {
  let tot = 0; for (const it of list) tot += it.w;
  let v = r * tot;
  for (const it of list) { v -= it.w; if (v <= 0) return it; }
  return list[list.length - 1];
}
function shade(hex, amt) { // amt -1..1
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
  let r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  if (amt > 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function rgba(hex, a) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
  return `rgba(${parseInt(c.substr(0, 2), 16)},${parseInt(c.substr(2, 2), 16)},${parseInt(c.substr(4, 2), 16)},${a})`;
}

// world-map location tiles: towns A–G, dungeons 1–7
const LOC_RE = /^[A-G1-7]$/;
const isLoc = c => typeof c === 'string' && LOC_RE.test(c);

// ---------- settings (persist separately from the save file) ----------
const CFG_KEY = 'lanternfall_cfg_v1';
const TEXT_SPEEDS = [{ label: 'Normal', v: 55 }, { label: 'Fast', v: 120 }, { label: 'Instant', v: 99999 }];
const CFG = { dash: false, textSpeed: 0, muted: false };
try { Object.assign(CFG, JSON.parse(localStorage.getItem(CFG_KEY)) || {}); } catch (e) { }
function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (e) { } }

// ---------- input ----------
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Enter: 'ok', Space: 'ok', KeyZ: 'ok', KeyE: 'ok', NumpadEnter: 'ok',
  Escape: 'cancel', KeyX: 'cancel', Backspace: 'cancel', KeyQ: 'cancel', KeyC: 'cancel',
  KeyM: 'mute', ShiftLeft: 'run', ShiftRight: 'run'
};
const ACTIONS = ['up', 'down', 'left', 'right', 'ok', 'cancel', 'mute', 'run'];
const REPEAT = new Set(['up', 'down', 'left', 'right']);
const Input = {
  down: {}, vdown: {}, tapped: {}, hold: {}, fired: {}, anyKey: false,
  update(dt) {
    for (const a of ACTIONS) {
      const d = this.down[a] || this.vdown[a] || this.tapped[a];
      if (d) {
        const h = this.hold[a] || 0, nh = h + dt;
        const R0 = 0.3, RI = 0.08;
        this.fired[a] = h === 0 || (REPEAT.has(a) && nh > R0 && Math.floor((nh - R0) / RI) > Math.floor(Math.max(0, h - R0) / RI));
        this.hold[a] = nh;
      } else { this.fired[a] = false; this.hold[a] = 0; }
      this.tapped[a] = false;
    }
  },
  p(a) { return !!this.fired[a]; },
  h(a) { return !!(this.down[a] || this.vdown[a]); },
  clear() { for (const a of ACTIONS) this.fired[a] = false; }
};
window.addEventListener('keydown', e => {
  const a = KEYMAP[e.code];
  Audio_.unlock();
  if (a) {
    e.preventDefault();
    if (!Input.down[a]) Input.tapped[a] = true;
    Input.down[a] = true;
  }
});
window.addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) Input.down[a] = false; });
window.addEventListener('blur', () => { Input.down = {}; Input.vdown = {}; });

// touch controls
(function setupTouch() {
  const pad = document.getElementById('touch');
  if (!pad) return;
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (!isTouch) return;
  pad.style.display = 'block';
  pad.querySelectorAll('[data-a]').forEach(el => {
    const a = el.dataset.a;
    const on = e => { e.preventDefault(); Audio_.unlock(); if (!Input.vdown[a]) Input.tapped[a] = true; Input.vdown[a] = true; el.classList.add('on'); };
    const off = e => { e.preventDefault(); Input.vdown[a] = false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  });
})();

// ---------- timers / tweens ----------
const Timers = [];
function wait(ms) { return new Promise(res => Timers.push({ t: ms / 1000, res })); }
function updateTimers(dt) {
  for (let i = Timers.length - 1; i >= 0; i--) {
    Timers[i].t -= dt;
    if (Timers[i].t <= 0) { const r = Timers[i].res; Timers.splice(i, 1); r(); }
  }
}
const Fade = { v: 0, target: 0, speed: 3, color: '#000', res: null };
function fadeTo(v, ms = 350, color = '#000') {
  Fade.target = v; Fade.speed = 1 / Math.max(0.01, ms / 1000); Fade.color = color;
  return new Promise(res => { Fade.res = res; if (Fade.v === v) { Fade.res = null; res(); } });
}
function updateFade(dt) {
  if (Fade.v !== Fade.target) {
    const d = Fade.speed * dt;
    Fade.v = Fade.v < Fade.target ? Math.min(Fade.target, Fade.v + d) : Math.max(Fade.target, Fade.v - d);
    if (Fade.v === Fade.target && Fade.res) { const r = Fade.res; Fade.res = null; r(); }
  }
}

// ---------- scripting ----------
const Script = { running: 0 };
async function runScript(fn) {
  Script.running++;
  try { await fn(); } catch (e) { console.error(e); }
  finally { Script.running--; }
}

// ---------- UI stack ----------
const UI = {
  stack: [],
  push(c) { return new Promise(res => { c._res = res; this.stack.push(c); }); },
  close(c, v) { const i = this.stack.indexOf(c); if (i >= 0) this.stack.splice(i, 1); if (c._res) c._res(v); },
  top() { for (let i = this.stack.length - 1; i >= 0; i--) if (!this.stack[i].passive) return this.stack[i]; return null; },
  update(dt) {
    for (const c of this.stack) if (c.tick) c.tick(dt);
    const t = this.top();
    if (t) { t.update(dt); Input.clear(); return true; }
    return false;
  },
  draw(g) { for (const c of this.stack) c.draw(g); }
};

const FONT = '"Trebuchet MS", "Segoe UI", Verdana, sans-serif';
const SERIF = 'Georgia, "Times New Roman", serif';
function font(px, bold = false, fam = FONT) { return `${bold ? 'bold ' : ''}${px}px ${fam}`; }

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function drawWindow(g, x, y, w, h, alpha = 0.94) {
  g.save();
  g.globalAlpha = alpha;
  const gr = g.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, '#2b4bb8'); gr.addColorStop(1, '#0c1650');
  roundRect(g, x, y, w, h, 7); g.fillStyle = gr; g.fill();
  g.globalAlpha = 1;
  g.lineWidth = 3; g.strokeStyle = '#e9eefc'; g.stroke();
  roundRect(g, x + 3.5, y + 3.5, w - 7, h - 7, 5); g.lineWidth = 1; g.strokeStyle = 'rgba(120,150,255,.55)'; g.stroke();
  g.restore();
}
function text(g, s, x, y, o = {}) {
  g.font = o.font || font(o.size || 16, o.bold, o.fam);
  g.textAlign = o.align || 'left';
  g.textBaseline = o.base || 'top';
  if (o.shadow !== false) { g.fillStyle = 'rgba(0,0,0,.6)'; g.fillText(s, x + 1.5, y + 1.5); }
  g.fillStyle = o.color || '#fff';
  g.fillText(s, x, y);
}
function wrapText(g, s, maxW, f) {
  g.font = f;
  const out = [];
  for (const para of String(s).split('\n')) {
    const words = para.split(' ');
    let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function drawCursor(g, x, y, t = performance.now() / 1000) {
  const o = Math.sin(t * 8) * 2;
  g.save(); g.translate(x + o, y);
  g.beginPath(); g.moveTo(-10, -7); g.lineTo(2, 0); g.lineTo(-10, 7); g.lineTo(-7, 0); g.closePath();
  g.fillStyle = '#fff'; g.strokeStyle = '#223'; g.lineWidth = 1.5; g.fill(); g.stroke();
  g.restore();
}
function bar(g, x, y, w, h, v, col, back = 'rgba(0,0,0,.5)') {
  g.fillStyle = back; g.fillRect(x, y, w, h);
  g.fillStyle = col; g.fillRect(x, y, w * clamp(v, 0, 1), h);
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1);
}

// Dialog box with typewriter + optional choices
class Dialog {
  constructor(name, msg, opts = {}) {
    this.name = name; this.opts = opts;
    this.f = font(17);
    this.pages = [];
    const lines = wrapText(ctx, msg, W - 80, this.f);
    for (let i = 0; i < lines.length; i += 3) this.pages.push(lines.slice(i, i + 3));
    this.page = 0; this.chars = 0; this.choices = opts.choices || null; this.ci = 0;
    this.top = !!opts.top; this.speed = opts.speed || (TEXT_SPEEDS[CFG.textSpeed] || TEXT_SPEEDS[0]).v;
  }
  get pageText() { return this.pages[this.page].join('\n'); }
  done() { return this.chars >= this.pageText.length; }
  update(dt) {
    const before = Math.floor(this.chars);
    this.chars = Math.min(this.pageText.length, this.chars + dt * this.speed);
    if (Math.floor(this.chars) !== before && Math.floor(this.chars) % 3 === 0) Audio_.sfx('blip');
    const last = this.page === this.pages.length - 1;
    if (this.choices && last && this.done()) {
      if (Input.p('up')) { this.ci = (this.ci + this.choices.length - 1) % this.choices.length; Audio_.sfx('cursor'); }
      if (Input.p('down')) { this.ci = (this.ci + 1) % this.choices.length; Audio_.sfx('cursor'); }
      if (Input.p('ok')) { Audio_.sfx('ok'); UI.close(this, this.ci); }
      else if (Input.p('cancel') && this.opts.cancel !== undefined) { Audio_.sfx('cancel'); UI.close(this, this.opts.cancel); }
      return;
    }
    if (Input.p('ok') || Input.p('cancel')) {
      if (!this.done()) this.chars = this.pageText.length;
      else if (!last) { this.page++; this.chars = 0; Audio_.sfx('cursor'); }
      else UI.close(this, 0);
    }
  }
  draw(g) {
    const h = 104, y = this.top ? 12 : H - h - 12, x = 12, w = W - 24;
    drawWindow(g, x, y, w, h);
    if (this.name) {
      g.font = font(15, true);
      const nw = g.measureText(this.name).width + 22;
      drawWindow(g, x + 10, y - 22, nw, 28);
      text(g, this.name, x + 21, y - 15, { size: 15, bold: true, color: '#ffe9a8' });
    }
    const lines = this.pageText.slice(0, Math.floor(this.chars)).split('\n');
    lines.forEach((l, i) => text(g, l, x + 22, y + 16 + i * 26, { font: this.f }));
    const last = this.page === this.pages.length - 1;
    if (this.done() && !(this.choices && last)) {
      const t = performance.now() / 1000;
      g.fillStyle = '#fff'; g.beginPath();
      const by = y + h - 18 + Math.sin(t * 6) * 2;
      g.moveTo(x + w - 26, by); g.lineTo(x + w - 16, by); g.lineTo(x + w - 21, by + 6); g.fill();
    }
    if (this.choices && last && this.done()) {
      g.font = font(16);
      const cw = Math.max(...this.choices.map(c => g.measureText(c).width)) + 50;
      const ch = this.choices.length * 26 + 18;
      const cx = W - cw - 18, cy = y - ch - 8;
      drawWindow(g, cx, cy, cw, ch);
      this.choices.forEach((c, i) => text(g, c, cx + 32, cy + 10 + i * 26));
      drawCursor(g, cx + 24, cy + 19 + this.ci * 26);
    }
  }
}
function say(name, msg, opts) { return UI.push(new Dialog(name, msg, opts)); }
function narrate(msg, opts = {}) { return UI.push(new Dialog(null, msg, opts)); }
function choose(name, msg, choices, cancel) { return UI.push(new Dialog(name, msg, { choices, cancel })); }
async function sayAll(lines) { for (const [n, m] of lines) await say(n, m); }

// Generic list menu
class ListMenu {
  constructor(o) {
    Object.assign(this, { x: 20, y: 20, w: 200, rows: 8, rowH: 26, title: null, cancel: true, index: 0, items: [], scroll: 0, size: 16 }, o);
    this.index = clamp(this.index, 0, Math.max(0, this.items.length - 1));
    this.fixScroll();
  }
  get h() { return Math.min(this.rows, Math.max(1, this.items.length)) * this.rowH + 20 + (this.title ? 26 : 0); }
  fixScroll() {
    if (this.index < this.scroll) this.scroll = this.index;
    if (this.index >= this.scroll + this.rows) this.scroll = this.index - this.rows + 1;
  }
  update() {
    const n = this.items.length;
    if (n && Input.p('up')) { this.index = (this.index + n - 1) % n; Audio_.sfx('cursor'); this.fixScroll(); this.onChange && this.onChange(this.index); }
    if (n && Input.p('down')) { this.index = (this.index + 1) % n; Audio_.sfx('cursor'); this.fixScroll(); this.onChange && this.onChange(this.index); }
    if (this.lr && n) {
      if (Input.p('left')) { this.lr(this.index, -1); }
      if (Input.p('right')) { this.lr(this.index, 1); }
    }
    if (Input.p('ok') && n) {
      const it = this.items[this.index];
      if (it.disabled) { Audio_.sfx('buzz'); return; }
      Audio_.sfx('ok'); UI.close(this, this.index);
    } else if (Input.p('cancel') && this.cancel) { Audio_.sfx('cancel'); UI.close(this, -1); }
  }
  draw(g) {
    const active = UI.top() === this;
    drawWindow(g, this.x, this.y, this.w, this.h);
    let y0 = this.y + 10;
    if (this.title) { text(g, this.title, this.x + 16, y0, { size: 15, bold: true, color: '#ffe9a8' }); y0 += 26; }
    const end = Math.min(this.items.length, this.scroll + this.rows);
    for (let i = this.scroll; i < end; i++) {
      const it = this.items[i], yy = y0 + (i - this.scroll) * this.rowH;
      const col = it.disabled ? '#8792b8' : (it.color || '#fff');
      text(g, it.label, this.x + 30, yy + 3, { size: this.size, color: col });
      if (it.right !== undefined) text(g, String(it.right), this.x + this.w - 16, yy + 3, { size: this.size, color: it.disabled ? '#8792b8' : (it.rcolor || '#dfe6ff'), align: 'right' });
      if (i === this.index) {
        if (active) drawCursor(g, this.x + 24, yy + 12);
        else { g.fillStyle = 'rgba(255,255,255,.13)'; g.fillRect(this.x + 8, yy, this.w - 16, this.rowH - 2); }
      }
    }
    if (this.scroll > 0) { g.fillStyle = '#fff'; g.beginPath(); const cx = this.x + this.w / 2; g.moveTo(cx - 6, this.y + 8); g.lineTo(cx + 6, this.y + 8); g.lineTo(cx, this.y + 2); g.fill(); }
    if (end < this.items.length) { g.fillStyle = '#fff'; g.beginPath(); const cx = this.x + this.w / 2, by = this.y + this.h - 8; g.moveTo(cx - 6, by); g.lineTo(cx + 6, by); g.lineTo(cx, by + 6); g.fill(); }
    if (this.help && active) {
      const s = this.help(this.index);
      if (s) { const hy = this.helpY || 12; drawWindow(g, 12, hy, W - 24, 40); text(g, s, 28, hy + 11, { size: 15 }); }
    }
  }
}
function listMenu(o) { return UI.push(new ListMenu(o)); }

// passive panel drawing a callback
class Panel {
  constructor(fn) { this.fn = fn; this.passive = true; }
  update() { }
  draw(g) { this.fn(g); }
}
function openPanel(fn) { const p = new Panel(fn); UI.stack.push(p); return p; }
function closePanel(p) { UI.close(p); }

// Toast (short message top)
const Toasts = [];
function toast(msg) { Toasts.push({ msg, t: 2.2 }); }
function drawToasts(g, dt) {
  for (let i = Toasts.length - 1; i >= 0; i--) { Toasts[i].t -= dt; if (Toasts[i].t <= 0) Toasts.splice(i, 1); }
  Toasts.forEach((t, i) => {
    g.save(); g.globalAlpha = clamp(t.t * 2, 0, 1);
    g.font = font(15);
    const w = g.measureText(t.msg).width + 30;
    drawWindow(g, (W - w) / 2, 14 + i * 40, w, 34);
    text(g, t.msg, W / 2, 23 + i * 40, { size: 15, align: 'center' });
    g.restore();
  });
}

// ---------- AUDIO (WebAudio chiptune) ----------
const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteFreq(n) {
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
  if (!m) return 0;
  let s = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  const midi = (parseInt(m[3]) + 1) * 12 + s;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function parseSeq(str) {
  const out = [];
  for (const tok of str.replace(/\|/g, ' ').split(/\s+/).filter(Boolean)) {
    const [n, d] = tok.split(':');
    out.push({ n, d: parseInt(d || '4') });
  }
  return out;
}
function pump(roots, pattern = 'oct') {
  // build bass line: each root fills one bar (16 steps) of eighth notes alternating root/octave
  const parts = [];
  for (const r of roots) {
    const m = /^([A-G][#b]?)(\d)$/.exec(r);
    const hi = m[1] + (parseInt(m[2]) + 1);
    if (pattern === 'oct') for (let i = 0; i < 8; i++) parts.push((i % 2 ? hi : r) + ':2');
    else if (pattern === 'half') parts.push(r + ':8', hi + ':8');
    else parts.push(r + ':16');
  }
  return parts.join(' ');
}
const TRACKS = {
  title: {
    bpm: 84, voices: [

    g.save(); g.translate(cx + 3, by - 18); g.rotate(-0.6); g.fillStyle = '#e8e8f0'; g.fillRect(-2, -9, 5, 12); g.restore();
    for (let i = 0; i < 3; i++) circle(g, cx - 6 + i * 6 + Math.sin(t + i) * 2, by - 30 - i * 3, 1.3, `rgba(200,230,255,${0.5 + 0.5 * Math.sin(t * 3 + i)})`);

// ---------------- TOWN TILES ----------------
function drawTownTile(g, map, x, y, px, py, t) {
  const ch = map.at(x, y);
  const theme = map.theme;
  const base = () => {
    if (theme === 'ash') {
      fillGround(g, 'ashsand', px, py, x, y);
      if (hash(x, y, 41) < 0.12) { const p = 0.5 + 0.5 * Math.sin(t * 2 + x * 1.7 + y); g.strokeStyle = `rgba(255,120,50,${0.3 + p * 0.4})`; g.lineWidth = 1.3; g.beginPath(); g.moveTo(px + 6, py + 10); g.lineTo(px + 15, py + 17); g.lineTo(px + 11, py + 27); g.stroke(); }
      return;
    }
    if (theme === 'snow') { fillGround(g, 'snow', px, py, x, y); return; }
    if (theme === 'sand') { fillGround(g, 'desert', px, py, x, y); return; }
    if (theme === 'stone') { g.fillStyle = (x + y) % 2 ? '#8e938a' : '#888d84'; g.fillRect(px, py, TS, TS); if (hash(x, y) < .3) { g.fillStyle = '#7a7f76'; g.fillRect(px + hash(x, y, 1) * 26, py + hash(x, y, 2) * 26, 4, 3); } }
    else fillGround(g, 'grass', px, py, x, y);
  };
  switch (ch) {
    case ':': {
      g.fillStyle = theme === 'stone' ? '#a8a49a' : theme === 'ash' ? '#a09890' : theme === 'snow' ? '#cfd6e2' : theme === 'sand' ? '#d8b880' : '#d6c8a6'; g.fillRect(px, py, TS, TS);
      g.strokeStyle = theme === 'stone' || theme === 'ash' ? '#8a867c' : theme === 'snow' ? '#aeb8c8' : '#b8a882'; g.lineWidth = 1;
      const o = (y % 2) * 8;
      g.beginPath();
      for (let i = 0; i < 2; i++) { g.moveTo(px, py + i * 16 + 16); g.lineTo(px + TS, py + i * 16 + 16); }
      for (let i = 0; i < 3; i++) { g.moveTo(px + o + i * 16 - 8 + 8, py); g.lineTo(px + o + i * 16, py + 16); g.moveTo(px + o + i * 16 - 8, py + 16); g.lineTo(px + o + i * 16 - 8, py + 32); }
      g.stroke();
      break;
    }
    case 't': base(); if (theme === 'sand') drawPalm(g, px + 16, py + 31, 1.5, x + y); else drawTreeRound(g, px + 16, py + 30, 1.55, '#3f8a3a', '#2a6a2a', '#5fae50'); break;
    case 'm': { g.fillStyle = theme === 'sand' ? '#a8603a' : '#7a6a5a'; g.fillRect(px, py, TS, TS); poly(g, [px, py + TS, px + 4, py + 6, px + 28, py + 4, px + TS, py + TS], theme === 'sand' ? '#c8784a' : '#8f7f6f', OUT, 1); g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(px + 6, py + 6, 20, 3); break; }
    case 'P': base(); drawPine(g, px + 16, py + 31, 1.35, '#3a7a5a', '#245a40', theme === 'stone' || theme === 'snow'); break;
    case 'f': {
      base();
      const cols = ['#ff6a8a', '#ffd84a', '#ffffff', '#b07aff'];
      for (let i = 0; i < 5; i++) { const fx = px + 4 + hash(x, y, i) * 24, fy = py + 4 + hash(x, y, i + 5) * 24; circle(g, fx, fy, 2.2, cols[(i + x) % 4]); circle(g, fx, fy, .8, '#fff6'); }
      break;
    }
    case 'F': {
      base();
      g.fillStyle = '#c8a070'; g.strokeStyle = OUT; g.lineWidth = 1;
      g.fillRect(px, py + 14, TS, 3); g.fillRect(px, py + 22, TS, 3);
      for (let i = 0; i < 2; i++) { rrect(g, px + 4 + i * 16, py + 10, 5, 20, 1, '#d8b080', OUT, 1); }
      break;
    }
    case '~': drawWater(g, px, py, x, y, map, t); break;
    case 'p': {
      drawWater(g, px, py, x, y, null, t);
      g.fillStyle = '#a8763f'; g.fillRect(px, py + 1, TS, 30);
      g.strokeStyle = '#6a4522'; g.lineWidth = 1;
      for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(px, py + 1 + i * 8); g.lineTo(px + TS, py + 1 + i * 8); g.stroke(); }
      break;
    }
    case 'r': {
      g.fillStyle = '#5f574f'; g.fillRect(px, py, TS, TS);
      ellipse(g, px + 10, py + 12, 12, 10, '#8a7f73', OUT, 1);
      ellipse(g, px + 24, py + 22, 10, 9, '#7a7065', OUT, 1);
      ellipse(g, px + 8, py + 9, 4, 3, '#a89e92');
      break;
    }
    case 'w': { // well
      base();
      ellipse(g, px + 16, py + 22, 12, 7, '#8a8a8a', OUT, 1.2);
      ellipse(g, px + 16, py + 21, 8, 4, '#1a3a6a');
      line(g, px + 5, py + 21, px + 5, py + 2, '#6a4522', 2.5); line(g, px + 27, py + 21, px + 27, py + 2, '#6a4522', 2.5);
      poly(g, [px + 2, py + 4, px + 16, py - 4, px + 30, py + 4], '#a0402e', OUT, 1);
      break;
    }
    case 'l': { // lamp post
      base();
      line(g, px + 16, py + 30, px + 16, py + 6, '#2a2a30', 2.5);
      const f = 0.7 + 0.3 * Math.sin(t * 7 + x);
      g.save(); g.globalAlpha = 0.25 * f; circle(g, px + 16, py + 6, 14, '#ffd27a'); g.restore();
      rrect(g, px + 12, py + 1, 8, 9, 2, '#ffe9a0', '#2a2a30', 1.5);
      break;
    }
    case 'c': { // crates
      base();
      rrect(g, px + 4, py + 12, 14, 14, 1, '#b8844a', OUT, 1); line(g, px + 4, py + 12, px + 18, py + 26, '#7a5428', 1);
      rrect(g, px + 16, py + 16, 12, 12, 1, '#a8743a', OUT, 1);
      break;
    }
    case 'a': { // anvil / forge
      base();
      rrect(g, px + 6, py + 16, 20, 6, 2, '#3a3a40', OUT, 1); rrect(g, px + 12, py + 22, 8, 8, 1, '#2a2a30', OUT, 1);
      break;
    }
    case 'b': { // brazier — Lastlight's thousand-year fire
      base();
      ellipse(g, px + 16, py + 29, 11, 3, 'rgba(0,0,0,.3)');
      poly(g, [px + 6, py + 16, px + 26, py + 16, px + 21, py + 28, px + 11, py + 28], '#4a4448', OUT, 1.2);
      rrect(g, px + 4, py + 13, 24, 4, 1, '#6a6268', OUT, 1);
      const f = Math.sin(t * 10 + x) * 2;
      g.save(); g.globalAlpha = 0.3 + 0.1 * Math.sin(t * 5); circle(g, px + 16, py + 6, 16, '#ffa040'); g.restore();
      poly(g, [px + 8, py + 14, px + 13 + f, py - 2 - f, px + 16, py + 6, px + 20 - f, py - 6 + f, px + 24, py + 14], '#ff7a2a');
      poly(g, [px + 12, py + 14, px + 16 + f * 0.5, py + 1, px + 20, py + 14], '#ffe08a');
      break;
    }
    case 'g': { // grave / stone
      base(); rrect(g, px + 10, py + 8, 12, 18, 6, '#9a9aa2', OUT, 1); line(g, px + 16, py + 12, px + 16, py + 20, '#6a6a72', 1.5); line(g, px + 13, py + 15, px + 19, py + 15, '#6a6a72', 1.5);
      break;
    }
    default: base();
  }
}

// Buildings drawn as whole structures. b = {x,y,w,h,kind,roof,label}
function drawBuilding(g, b, ox, oy, t, theme) {
  const x = b.x * TS - ox, y = b.y * TS - oy, w = b.w * TS, h = b.h * TS;
  const roofH = Math.floor(b.h * 0.55) * TS;
  const wallY = y + roofH, wallH = h - roofH;
  const stone = theme === 'stone' || theme === 'ash' || b.kind === 'jail' || b.kind === 'chapel';
  const wallC = b.wall || (stone ? '#b8b2a6' : '#f0e2c0');
  // shadow
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x + 6, y + h - 2, w, 6);
  // wall
  rrect(g, x + 2, wallY - 4, w - 4, wallH + 4, 2, wallC, OUT, 1.5);
  if (stone) {
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1;
    for (let r = 0; r < wallH / 10; r++) {
      g.beginPath(); g.moveTo(x + 3, wallY + r * 10); g.lineTo(x + w - 3, wallY + r * 10); g.stroke();
      for (let c = 0; c < w / 16; c++) { const bx = x + c * 16 + (r % 2) * 8; g.beginPath(); g.moveTo(bx, wallY + r * 10); g.lineTo(bx, wallY + r * 10 + 10); g.stroke(); }
    }
  } else {
    g.fillStyle = '#8a5a32';
    g.fillRect(x + 2, wallY - 4, 4, wallH + 4); g.fillRect(x + w - 6, wallY - 4, 4, wallH + 4);
    g.fillRect(x + 2, wallY + wallH / 2 - 2, w - 4, 3);
  }
  // windows
  const doorX = x + (b.doorX - b.x) * TS;
  const nWin = Math.max(1, b.w - 2);
  for (let i = 0; i < b.w; i++) {
    const wx = x + i * TS;
    if (Math.abs(wx - doorX) < 2 || i === 0 && b.w > 3 || i === b.w - 1 && b.w > 3) continue;
    const lit = 0.6 + 0.4 * Math.sin(t * 2 + i + b.x);
    rrect(g, wx + 9, wallY + 6, 14, 12, 2, b.kind === 'jail' ? '#2a2a30' : `rgba(255,220,130,${lit})`, '#5a3a1f', 2);
    if (b.kind === 'jail') { for (let k = 0; k < 3; k++) line(g, wx + 12 + k * 4, wallY + 6, wx + 12 + k * 4, wallY + 18, '#888', 1.5); }
    else { line(g, wx + 16, wallY + 6, wx + 16, wallY + 18, '#5a3a1f', 1.5); line(g, wx + 9, wallY + 12, wx + 23, wallY + 12, '#5a3a1f', 1.5); }
  }
  // door
  const dy = y + h - 26;
  rrect(g, doorX + 8, dy, 16, 26, 7, b.kind === 'jail' ? '#3a3a44' : '#6a3e1e', OUT, 1.5);
  circle(g, doorX + 20, dy + 15, 1.5, '#e8c24a');
  // roof
  const rc = b.roof || '#b5533c';
  if (b.kind === 'chapel') {
    poly(g, [x - 4, wallY, x + w / 2, y - 2, x + w + 4, wallY], rc, OUT, 1.5);
    // steeple
    const sx = x + w / 2;
    rrect(g, sx - 9, y - 26, 18, 30, 1, wallC, OUT, 1.2);
    poly(g, [sx - 12, y - 24, sx, y - 50, sx + 12, y - 24], rc, OUT, 1.5);
    // wave/sun emblem
    circle(g, sx, y - 11, 5, '#e8c24a', OUT, 1);
  } else {
    poly(g, [x - 5, wallY + 2, x + 10, y, x + w - 10, y, x + w + 5, wallY + 2], rc, OUT, 1.5);
    g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 1.2;
    for (let r = 1; r < roofH / 9; r++) {
      const yy = y + r * 9, k = r * 9 / roofH;
      g.beginPath(); g.moveTo(x + 10 - 15 * k, yy); g.lineTo(x + w - 10 + 15 * k, yy); g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(x + 10, y + 2, w - 20, 3);
    if (theme === 'snow') { poly(g, [x - 3, wallY - 2, x + 10, y + 2, x + w - 10, y + 2, x + w + 3, wallY - 2, x + w - 6, wallY - 6, x + w * 0.6, wallY - 3, x + w * 0.3, wallY - 7, x + 6, wallY - 5], 'rgba(255,255,255,.92)'); }
    if (b.chimney) { rrect(g, x + w - 30, y - 8, 9, 16, 1, '#8a5a4a', OUT, 1.2); const s = (t * 0.6) % 1; g.save(); g.globalAlpha = 0.5 * (1 - s); circle(g, x + w - 26, y - 12 - s * 18, 4 + s * 4, '#ddd'); g.restore(); }
  }
  // sign
  if (b.sign) {
    const sx = doorX + 30, sy = wallY + 2;
    if (sx + 26 < x + w) {
      line(g, sx + 13, sy - 4, sx + 13, sy, '#3a2a1a', 1.5);
      rrect(g, sx, sy, 26, 18, 3, '#e8d8a8', OUT, 1.2);
      drawSignIcon(g, b.sign, sx + 13, sy + 9);
    }
  }
  if (b.label) {
    g.save(); g.font = font(10, true); g.textAlign = 'center'; g.fillStyle = 'rgba(0,0,0,.4)';
    g.restore();
  }
}
function drawSignIcon(g, s, x, y) {
  if (s === 'inn') { rrect(g, x - 8, y - 2, 16, 6, 2, '#7a3a8a'); circle(g, x - 5, y - 3, 2.5, '#fff'); }
  else if (s === 'item') { rrect(g, x - 4, y - 5, 8, 10, 3, '#3ab0e0', OUT, 1); g.fillStyle = '#5a3a1f'; g.fillRect(x - 2, y - 7, 4, 3); }
  else if (s === 'arms') { line(g, x - 6, y + 5, x + 6, y - 5, '#8a8a9a', 2.5); line(g, x - 6, y - 3, x - 2, y + 1, '#5a3a1f', 2); }
  else if (s === 'anchor') { line(g, x, y - 6, x, y + 5, '#3a3a50', 2); g.beginPath(); g.arc(x, y + 1, 5, 0.2, Math.PI - 0.2); g.strokeStyle = '#3a3a50'; g.lineWidth = 2; g.stroke(); circle(g, x, y - 6, 2, null, '#3a3a50', 1.5); }
  else if (s === 'jail') { for (let i = 0; i < 4; i++) line(g, x - 6 + i * 4, y - 6, x - 6 + i * 4, y + 6, '#3a3a40', 1.5); }
  else if (s === 'arena') { line(g, x - 6, y + 5, x + 6, y - 5, '#8a8a9a', 2.2); line(g, x + 6, y + 5, x - 6, y - 5, '#8a8a9a', 2.2); circle(g, x, y, 2.5, '#c0302a'); }
  else if (s === 'hall') { poly(g, [x - 7, y - 1, x, y - 7, x + 7, y - 1], '#c0442e'); g.fillStyle = '#5a3a1f'; g.fillRect(x - 5, y - 1, 10, 7); }
}

// ---------------- DUNGEON TILES ----------------
const DTHEME = {
  hollow: { wall: '#4a3f2e', top: '#352d1f', floor: '#5c5238', floor2: '#544a32', acc: '#6aa040', light: 245, bg: 'cave' },
  shrine: { wall: '#3a5a7a', top: '#22344a', floor: '#6a8aa6', floor2: '#5f7f9a', acc: '#5af0d0', light: 290, bg: 'shrine' },
  mine: { wall: '#5a3a2a', top: '#2e1e14', floor: '#6a4a36', floor2: '#5f4230', acc: '#ff8a2a', light: 240, bg: 'mine' },
  tomb: { wall: '#a8844a', top: '#4a3418', floor: '#c8a868', floor2: '#bc9c5e', acc: '#ffc04a', light: 255, bg: 'tomb' },
  astral: { wall: '#2a3a6a', top: '#141e3c', floor: '#22305a', floor2: '#1e2a50', acc: '#a8d8ff', light: 280, bg: 'astral' },
  spire: { wall: '#3a2a4e', top: '#1c1228', floor: '#2e2440', floor2: '#281f38', acc: '#c070ff', light: 260, bg: 'spire' },
  abyss: { wall: '#3a3238', top: '#120c10', floor: '#2e282c', floor2: '#2a2428', acc: '#ff8a4a', light: 235, bg: 'abyss' }
};
function drawDungeonTile(g, map, x, y, px, py, t) {
  const th = DTHEME[map.theme];
  const ch = map.at(x, y);
  if (ch === '#' || ch === undefined) {
    const below = map.at(x, y + 1);
    if (below && below !== '#') {
      // front face
      g.fillStyle = th.wall; g.fillRect(px, py, TS, TS);
      g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = 1;
      for (let r = 0; r < 3; r++) {
        g.beginPath(); g.moveTo(px, py + r * 11); g.lineTo(px + TS, py + r * 11); g.stroke();
        const o = ((r + x) % 2) * 8;
        g.beginPath(); g.moveTo(px + o + 8, py + r * 11); g.lineTo(px + o + 8, py + r * 11 + 11); g.moveTo(px + o + 24, py + r * 11); g.lineTo(px + o + 24, py + r * 11 + 11); g.stroke();
      }

'use strict';
// ============================================================
//  MAPS — world generation, towns, dungeons
// ============================================================
class GameMap {
  constructor(o) { Object.assign(this, { entities: [], buildings: [] }, o); }
  at(x, y) { if (y < 0 || y >= this.h || x < 0 || x >= this.w) return undefined; return this.tiles[y][x]; }
  set(x, y, c) { if (y >= 0 && y < this.h && x >= 0 && x < this.w) this.tiles[y][x] = c; }
}

function vnoise(x, y, seed) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy, seed), b = hash(ix + 1, iy, seed), c = hash(ix, iy + 1, seed), d = hash(ix + 1, iy + 1, seed);
  return lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
}
function fbm(x, y, seed) { return (vnoise(x, y, seed) * 0.6 + vnoise(x * 2.1, y * 2.1, seed + 1) * 0.28 + vnoise(x * 4.3, y * 4.3, seed + 2) * 0.12); }

// ------------ WORLD ------------
const WORLD_LOC = {
  A: { x: 14, y: 43, town: 'brightwater', name: 'Brightwater' },
  B: { x: 38, y: 38, town: 'halden', name: 'Port Halden' },
  C: { x: 40, y: 15, town: 'ironhold', name: 'Ironhold' },
  D: { x: 28, y: 8, town: 'frostmere', name: 'Frostmere' },
  E: { x: 79, y: 38, town: 'mirage', name: 'Mirage' },
  F: { x: 87, y: 24, town: 'aerie', name: 'Aerie' },
  1: { x: 8, y: 31, dungeon: 'hollow', name: 'Whisperwood Hollow' },
  2: { x: 35, y: 50, dungeon: 'shrine', name: 'Sunken Shrine' },
  3: { x: 52, y: 6, dungeon: 'mine', name: 'Emberdeep Mines' },
  4: { x: 60, y: 40, dungeon: 'spire', name: 'Hollow Spire' },
  5: { x: 9, y: 12, dungeon: 'observatory', name: 'Starfall Observatory' },
  6: { x: 85, y: 45, dungeon: 'tomb', name: 'Tomb of the First King' },
  // Chapter VI — the Ashen Isle (hidden under the sea until G.flags.isle)
  G: { x: 79, y: 9, town: 'lastlight', name: 'Lastlight' },
  7: { x: 88, y: 7, dungeon: 'abyss', name: 'Crownfall Abyss' }
};
const ISLE_LOCS = ['G', '7'];
const SHIP_HOME = { x: 40, y: 38 };
const BRIDGE_Y = 43;
function riverX(y) { return 29 + Math.round(Math.sin(y * 0.35) * 1.2); }

function genWorld() {
  const w = 98, h = 56;
  const tiles = [], region = [];
  const blobs = [
    { id: 'A', cx: 21, cy: 39, rx: 20, ry: 13, ok: (x, y) => y >= 25 && x <= 45 },
    { id: 'B', cx: 44, cy: 12, rx: 24, ry: 8.5, ok: (x, y) => y <= 21 && x <= 69 },
    { id: 'F', cx: 84, cy: 33, rx: 11, ry: 15, ok: (x, y) => x >= 73 },
    { id: 'C', cx: 60, cy: 40, rx: 7.5, ry: 6.5, ok: (x, y) => x >= 52 && y >= 32 },
    { id: 'E', cx: 9, cy: 12, rx: 5.5, ry: 4.5, ok: (x, y) => x <= 15 && y <= 20 },
    { id: 'H', cx: 84, cy: 8, rx: 10, ry: 5, ok: (x, y) => x >= 74 && y <= 14 }
  ];
  for (let y = 0; y < h; y++) {
    tiles.push([]); region.push([]);
    for (let x = 0; x < w; x++) {
      let ch = '~', reg = null;
      if (x >= 2 && y >= 2 && x < w - 2 && y < h - 2) {
        for (const b of blobs) {
          const dx = (x - b.cx) / b.rx, dy = (y - b.cy) / b.ry, v = dx * dx + dy * dy;
          const n = fbm(x * 0.17, y * 0.17, b.id.charCodeAt(0));
          if (v < 1 + (n - 0.5) * 0.9 && b.ok(x, y)) { ch = '.'; reg = b.id; }
        }
      }
      tiles[y].push(ch); region[y].push(reg);
    }
  }
  const at = (x, y) => (y < 0 || y >= h || x < 0 || x >= w) ? '~' : tiles[y][x];
  const set = (x, y, c) => { if (y >= 0 && y < h && x >= 0 && x < w) tiles[y][x] = c; };
  // terrain
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (tiles[y][x] === '~') continue;
    const reg = region[y][x];
    const e = fbm(x * 0.13, y * 0.13, 11), m = fbm(x * 0.17, y * 0.17, 23);
    let c = '.';
    if (reg === 'C') c = e > 0.68 ? '^' : m > 0.5 ? 'd' : 'q';
    else if (reg === 'F') c = e > 0.66 ? 'm' : hash(x, y, 91) < 0.07 ? 'v' : 'z';
    else if (reg === 'H') c = e > 0.7 ? '^' : m > 0.6 ? 'd' : '.';
    else if (reg === 'B') {
      const snow = y < 10;
      if (e > 0.62) c = snow ? 'M' : '^'; else if (e > 0.57) c = snow ? '*' : 'n'; else if (m > 0.55) c = snow ? 'P' : 'T'; else c = snow ? '*' : '.';
    } else {
      if (e > 0.67) c = '^'; else if (e > 0.6) c = 'n'; else if (m > 0.57) c = 'T'; else c = '.';
    }
    tiles[y][x] = c;
  }
  // beaches
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = tiles[y][x];
    if (c === '.' || c === 'n' || c === 'T') {
      if ([[0, 1], [1, 0], [0, -1], [-1, 0]].some(([dx, dy]) => at(x + dx, y + dy) === '~') && hash(x, y, 77) < 0.75) tiles[y][x] = 's';
    }
  }
  // river on continent A
  for (let y = 0; y < h; y++) {
    const rx = riverX(y);
    for (const xx of [rx, rx + 1]) if (region[y][xx] === 'A' && tiles[y][xx] !== '~') tiles[y][xx] = 'r';
  }
  const groundFor = (x, y) => region[y][x] === 'C' ? 'q' : (region[y][x] === 'B' && y < 10) ? '*' : '.';
  const clearAround = (cx, cy, r, keepForest) => {
    for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
      const c = at(x, y);
      if (c === '~' || c === 'r' || c === undefined) continue;
      if (c === '^' || c === 'M' || (!keepForest && (c === 'T' || c === 'P' || c === 'd'))) set(x, y, groundFor(x, y));
    }
  };
  const road = (x0, y0, x1, y1, allowWater = false, yFirst = false) => {
    let x = x0, y = y0;
    const step = () => {
      const c = at(x, y);
      if (isLoc(c)) return;
      if (c === '~' || c === 'r') { if (allowWater && c === '~') { set(x, y, '='); region[y][x] = region[y][x] || 'A'; } return; }
      set(x, y, '=');
    };
    step();
    let n = 0;
    while ((x !== x1 || y !== y1) && n++ < 400) {
      const dx = x1 - x, dy = y1 - y;
      const goY = yFirst ? dy !== 0 : (Math.abs(dy) > Math.abs(dx) || dx === 0);
      if (goY && dy !== 0) y += Math.sign(dy); else x += Math.sign(dx);
      step();
    }
  };
  // force land near shrine (peninsula)
  for (let y = 46; y <= 52; y++) for (let x = 33; x <= 37; x++) {
    const d = Math.abs(x - 35) + Math.abs(y - 50) * 0.8;
    if (d <= 3 && (tiles[y][x] === '~')) { tiles[y][x] = 's'; region[y][x] = 'A'; }
  }
  // Whisperwood forest ring
  for (let y = 26; y <= 36; y++) for (let x = 3; x <= 14; x++) {
    if (region[y][x] === 'A' && tiles[y][x] !== '~' && tiles[y][x] !== 'r' && Math.hypot(x - 8, y - 31) < 4.6 + hash(x, y, 4) * 1.5) tiles[y][x] = 'T';
  }
  // Sunscar: oasis by Mirage, palm groves
  for (let y = 34; y <= 42; y++) for (let x = 75; x <= 84; x++) {
    if (region[y][x] !== 'F' || tiles[y][x] === '~') continue;
    const d = Math.hypot(x - 81, y - 37);
    if (d < 1.6) tiles[y][x] = '~'; else if (d < 3.2 && hash(x, y, 5) < 0.6) tiles[y][x] = 'T'; else if (tiles[y][x] === 'm') tiles[y][x] = 'z';
  }
  // Skyreach: a valley walled in by mesas — reachable only from the air
  for (let y = 18; y <= 30; y++) for (let x = 80; x <= 94; x++) {
    const d = Math.hypot(x - 87, (y - 24) * 1.1);
    if (d < 2.6) { tiles[y][x] = '.'; region[y][x] = 'G'; }
    else if (d < 4.4) { tiles[y][x] = 'm'; region[y][x] = 'F'; }
  }
  // place locations
  for (const k in WORLD_LOC) {
    const L = WORLD_LOC[k];
    if (ISLE_LOCS.includes(k)) region[L.y][L.x] = 'H';
    else if (tiles[L.y][L.x] === '~') region[L.y][L.x] = region[L.y][L.x] || (k === '4' ? 'C' : 'A');
    clearAround(L.x, L.y, 1, k === '1');
    tiles[L.y][L.x] = k;
  }
  // channel for the harbor
  for (let x = SHIP_HOME.x; x <= 50; x++) { if (tiles[38][x] !== 'B') tiles[38][x] = '~'; }
  for (let x = SHIP_HOME.x + 1; x <= 50; x++) tiles[37][x] = tiles[37][x] === '.' || tiles[37][x] === 's' || tiles[37][x] === 'T' || tiles[37][x] === 'n' || tiles[37][x] === '^' ? tiles[37][x] : tiles[37][x];
  // roads
  road(14, 42, 9, 32, false, true);         // Brightwater -> Hollow
  const rx = riverX(BRIDGE_Y);
  road(15, 43, rx - 1, BRIDGE_Y);            // Brightwater -> bridge
  set(rx, BRIDGE_Y, 'x'); set(rx + 1, BRIDGE_Y, 'x');
  road(rx + 2, BRIDGE_Y, 37, 38);            // bridge -> Halden

async function changeMap(mapId, x, y, dir) {

  Field.enter(mapId, x, y, dir);
  await fadeTo(0, 260);
  if (mapId === 'world') await worldEvents();
}
function freeNeighbor(map, x, y) {
  for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1]]) {
    const c = map.at(x + dx, y + dy);
    if (c !== undefined && !DUNGEON_SOLID.has(c) && c !== '<' && c !== '>' && !map.extras.chests.some(ch => ch.x === x + dx && ch.y === y + dy)) return [x + dx, y + dy];

}
async function enterLocation(ch) {
  const L = WORLD_LOC[ch];
  G.flags['visit_' + ch] = true;
  if (L.town) {
    const d = TOWN_DEFS[L.town];
    const [ex, ey] = d.exits[0];
    let sx = ex, sy = ey, dir = 'up';
    if (ey === d.h - 1) { sy = ey - 1; dir = 'up'; } else if (ex === 0) { sx = 1; dir = 'right'; }
    await changeMap(L.town, sx, sy, dir);
    await onEnterTown(L.town);
  } else {
    const ok = await canEnterDungeon(L.dungeon);
    if (!ok) return;
    const m = getMap(L.dungeon + ':0');
    const [x, y] = freeNeighbor(m, m.up.x, m.up.y);
    await changeMap(m.id, x, y, 'down');
    await onEnterDungeon(L.dungeon);
  }
}

}

  const nm = getMap(did + ':' + f);

async function innStay(townId, price, keeper = 'Innkeeper') {
  const c = await choose(keeper, `Welcome, travelers! A warm bed is ${price} gold for the party. Will you rest?`, ['Stay', 'No thanks'], 1);
  if (c !== 0) { await say(keeper, 'Another time, then.'); return; }

  G.gold -= price;
  await fadeTo(1, 500);
  Audio_.stopMusic();
  Audio_.sfx('inn');
  healAll();
  G.lastInn = { town: townId };
  await wait(1600);
  Field.playMusic();
  Audio_.play(Audio_.curName, true);
  await fadeTo(0, 500);
  await say(keeper, 'Good morning! You look well rested.');
  const s = await choose(null, 'Record your journey?', ['Save', 'Not now'], 1);
  if (s === 0 && saveGame()) { Audio_.sfx('save'); await narrate('Your journey has been recorded.'); }
}

// ---------- fishing ----------
function fishKinds() { return Object.keys(FISH).filter(id => G.flags['fish_' + id]).length; }
function rollFish(spot) {
  // The Lantern Koi only rises once every Lantern burns again
  if (G.flags.ending && Math.random() < 0.03) return 'koi';
  return weighted(FISH_SPOTS[spot]).f;
}

class FishingUI {
  constructor(fish) {
    this.fish = fish; this.diff = FISH[fish].diff;
    this.state = 'wait'; this.t = 0; this.wait = rnd(1.2, 3.4);
    this.zoneW = [0, 0.3, 0.22, 0.15][this.diff];
    this.need = this.diff + 1; this.hits = 0; this.misses = 0;
    this.pos = 0; this.vel = 0.9; this.zone = rnd(0.15, 0.85 - this.zoneW);
    this.flashT = 0; this.flashCol = null; this.msg = 'Waiting for a bite...';
  }
  done(result) { UI.close(this, result); }
  update(dt) {
    this.t += dt; this.flashT = Math.max(0, this.flashT - dt);
    if (Input.p('cancel')) { Audio_.sfx('cancel'); return this.done({ ok: false, why: 'You reel in your line.' }); }
    if (this.state === 'wait') {
      if (Input.p('ok')) { Audio_.sfx('splash'); return this.done({ ok: false, why: 'Too soon! The fish scattered.' }); }
      if (this.t >= this.wait) { this.state = 'bite'; this.t = 0; this.msg = 'A bite! Press Enter!'; Audio_.sfx('bite'); }
    } else if (this.state === 'bite') {
      if (Input.p('ok')) { this.state = 'reel'; this.t = 0; this.msg = 'Reel it in! Press Enter in the green.'; Audio_.sfx('reel'); }
      else if (this.t > 0.9) { Audio_.sfx('splash'); return this.done({ ok: false, why: 'It got away...' }); }
    } else if (this.state === 'reel') {
      this.pos += this.vel * dt;
      if (this.pos > 1) { this.pos = 2 - this.pos; this.vel = -this.vel; }
      if (this.pos < 0) { this.pos = -this.pos; this.vel = -this.vel; }
      if (Input.p('ok')) {
        if (this.pos >= this.zone && this.pos <= this.zone + this.zoneW) {
          this.hits++; Audio_.sfx('reel'); this.flashT = 0.25; this.flashCol = '#7aff9a';
          if (this.hits >= this.need) { Audio_.sfx('chest'); return this.done({ ok: true }); }
          this.vel = Math.sign(this.vel) * (Math.abs(this.vel) + 0.35);
          this.zone = rnd(0.08, 0.92 - this.zoneW);
        } else {
          this.misses++; Audio_.sfx('buzz'); this.flashT = 0.25; this.flashCol = '#ff7a7a';
          if (this.misses >= 2) { Audio_.sfx('splash'); return this.done({ ok: false, why: 'The line snapped! It got away.' }); }
        }
      }
    }
  }
  draw(g) {
    const x = 140, y = 110, w = 360, h = 230, t = performance.now() / 1000;
    drawWindow(g, x, y, w, h);
    text(g, 'Fishing', x + 16, y + 10, { size: 15, bold: true, color: '#ffe9a8' });
    // water
    const wx = x + 14, wy = y + 36, ww = w - 28, wh = 120;
    const gr = g.createLinearGradient(0, wy, 0, wy + wh); gr.addColorStop(0, '#2c6fc4'); gr.addColorStop(1, '#13406a');
    g.fillStyle = gr; g.fillRect(wx, wy, ww, wh);
    g.strokeStyle = 'rgba(200,230,255,.35)'; g.lineWidth = 1.5;
    for (let r = 0; r < 5; r++) { const yy = wy + 14 + r * 24; g.beginPath(); for (let xx = 0; xx <= ww; xx += 12) g.lineTo(wx + xx, yy + Math.sin(xx * 0.08 + t * 2 + r) * 2); g.stroke(); }
    // bobber
    const bx = wx + ww / 2, dip = this.state === 'bite' ? 8 + Math.sin(t * 30) * 3 : this.state === 'reel' ? 10 : Math.sin(t * 3) * 2;
    const by = wy + 52 + dip;
    line(g, bx, wy - 6, bx, by - 6, 'rgba(255,255,255,.7)', 1);
    if (this.state !== 'wait') { g.save(); g.globalAlpha = 0.6; circle(g, bx, by + 4, 10 + (t * 20) % 12, null, '#d8f4ff', 1.5); g.restore(); }
    circle(g, bx, by, 6, '#fff', OUT, 1.2); g.beginPath(); g.arc(bx, by, 6, 0, Math.PI); g.fillStyle = '#d03a2a'; g.fill();
    if (this.state === 'bite') text(g, '!', bx + 14, by - 30, { size: 28, bold: true, color: '#ffd23a' });
    // reel bar
    const rx = x + 30, ry = y + 172, rw = w - 60;
    g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(rx, ry, rw, 14);
    if (this.state === 'reel') {
      g.fillStyle = '#4ac86a'; g.fillRect(rx + this.zone * rw, ry, this.zoneW * rw, 14);
      const mx = rx + this.pos * rw;
      poly(g, [mx - 6, ry - 8, mx + 6, ry - 8, mx, ry + 2], '#fff', OUT, 1);
      line(g, mx, ry, mx, ry + 14, '#fff', 2);
    }
    g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 1; g.strokeRect(rx + 0.5, ry + 0.5, rw - 1, 13);
    for (let i = 0; i < this.need; i++) circle(g, x + w - 24 - i * 14, y + 18, 4.5, i < this.hits ? '#7aff9a' : 'rgba(255,255,255,.18)', '#fff', 1);
    if (this.flashT > 0) { g.save(); g.globalAlpha = this.flashT * 2; g.fillStyle = this.flashCol; g.fillRect(rx, ry, rw, 14); g.restore(); }
    text(g, this.msg, x + w / 2, y + h - 34, { size: 14, align: 'center' });
    text(g, 'Esc: stop', x + w - 14, y + h - 18, { size: 11, align: 'right', color: '#b8c4ee' });
  }
}

async function goFishing(spot) {
  if (!FISH_SPOTS[spot]) return;
  Audio_.sfx('splash');
  while (true) {
    const fish = rollFish(spot);
    const r = await UI.push(new FishingUI(fish));
    if (r.ok) {
      const first = !G.flags['fish_' + fish];
      G.flags['fish_' + fish] = (G.flags['fish_' + fish] || 0) + 1;
      addItem(fish);
      await narrate(`Caught a ${ITEMS[fish].name}!${first ? '  ★ New!' : ''}  (${fishKinds()}/${Object.keys(FISH).length} kinds)`);
      if (fish === 'koi') await say(LY, 'It\'s glowing! Arin, it\'s actually glowing! Old Bram is never going to believe this.');
    } else await narrate(r.why);
    if (r.why === 'You reel in your line.') return;
    const c = await choose(null, 'Cast again?', ['Cast', 'Stop'], 1);
    if (c !== 0) return;
  }
}

function recipeReady(r) { return G.gold >= r.gold && Object.entries(r.mats).every(([m, n]) => (G.inv[m] || 0) >= n); }
function drawRecipe(g, r) {

  const it = ITEMS[r.out];
  drawWindow(g, 330, 16, 294, 300);

}
async function forgeMenu() {
  let idx = 0;
  while (true) {
    const sel = { v: idx };
    const panel = openPanel(g => drawRecipe(g, RECIPES[sel.v]));
    const k = await listMenu({
      x: 16, y: 16, w: 300, rows: 9, title: 'Orrin\'s Forge', index: idx, onChange: i => sel.v = i,
      items: RECIPES.map(r => ({ label: ITEMS[r.out].name, right: G.inv[r.out] ? '×' + G.inv[r.out] : '', color: recipeReady(r) ? '#fff' : '#8792b8' })),

async function talkElder() {
  const f = G.flags;
  if (!f.q1) {
    await sayAll([
      ['Elder Maren', 'Arin. Good. Your father tended the Ember Lantern for thirty years, and his father before him.'],
      ['Elder Maren', 'Tonight, for the first time in a thousand years, it went out. Already the wood is crawling with things that should stay buried.'],
      ['Elder Maren', 'Go to Whisperwood Hollow, northwest of the village. Find the Lantern and kindle it again — with a lamplighter\'s flame. Your flame.'],
      [LY, 'Leave the monsters to me. I\'ve been practicing!'],
      ['Elder Maren', 'That is exactly what worries me. Here — take these, and come back to me alive.']
    ]);
    addItem('potion', 4); addItem('antidote', 2); G.gold += 60; Audio_.sfx('item');
    await narrate('Received 4 Potions, 2 Antidotes and 60 gold.');
    f.q1 = true;
    await say('Elder Maren', 'The road north of the village leads into the wood. And Arin — the inn is free for heroes. Well. Cheap.');
    return;
  }
  if (!f.lantern1) { await say('Elder Maren', 'Whisperwood Hollow lies northwest, where the trees grow thick. Follow the road from the village. Be careful.'); return; }
  if (!f.bridge) {
    await sayAll([
      ['Elder Maren', 'The sky over the wood is clear again! I knew it. I knew you had your father\'s hands.'],
      [A, 'There was someone there, Elder. A woman in black. She said three flames remain... and that the Night is patient.'],
      ['Elder Maren', '...Then the Ember Lantern was only the first. She will go for the Tide Lantern next — in the Sunken Shrine, south of Port Halden.'],
      ['Elder Maren', 'The villagers worked all night to patch the old river bridge east of here. Cross it, and find Port Halden on the coast.'],
      ['Elder Maren', 'There is a priest there named Oswin. He has written to me of dreams — lanterns going dark one by one. Trust him.'],
      ['Elder Maren', 'And take this. It is not much, but the road is long.']
    ]);
    G.gold += 300; Audio_.sfx('item');
    await narrate('Received 300 gold. The river bridge to the east has been repaired!');
    f.bridge = true; applyWorldFlags(getMap('world'));
    return;
  }
  if (!f.lantern2) { await say('Elder Maren', 'Port Halden lies east, across the river bridge. Find Oswin.'); return; }
  if (!f.lantern3) { await say('Elder Maren', 'Two Lanterns burn again. I can feel it in the soil — the earth is less afraid. Ironhold and the Stone Lantern lie north, across the sea.'); return; }
  if (!f.ending) { await say('Elder Maren', 'Selene... alive. Bring her home, Arin. Bring them all home.'); return; }
  if (f.isle && !f.boss_abyss) { await say('Elder Maren', 'An island, rising out of the sea? Go, then. A lamplighter\'s work is never quite finished. Your father used to say that, and then fall asleep in his chair.'); return; }
  await say('Elder Maren', 'Four Lanterns, burning. I never thought I would live to see a dawn like this one.');
}
async function talkMother() {

async function talkKid() { await say('Tess', 'I saw a woman in a black hood on the cliffs last night! She looked SO sad. Then she just... wasn\'t there.'); }

async function talkDunmar() {
  const f = G.flags;
  if (f.kestrel) { await say('Captain Dunmar', f.lantern3 ? 'The screaming in the deep shafts has stopped. Ironhold owes you, lamplighters.' : 'Keep an eye on that thief. And on your purses.'); return; }
  if (!f.metKestrel) {
    await sayAll([
      ['Captain Dunmar', 'Emberdeep is sealed. By order of the Thane, nobody goes in. Not since the Stone Lantern dimmed and the deep shafts started screaming.'],
      ['Captain Dunmar', 'The only way in would be one the dwarves never sealed. And the only folk who\'d know of one are sitting in my jail.']
    ]);
    return;
  }
  await sayAll([
    ['Captain Dunmar', 'You want me to release the slipperiest thief in the Undercity... into your custody... so she can lead you into a sealed mine full of monsters.'],
    [OS, 'When you put it like that, it does sound wonderful.'],
    ['Captain Dunmar', '...My men won\'t go near those shafts. Fine. Take her. If she runs, she\'s YOUR problem.']
  ]);
  await fadeTo(1, 300); await wait(400);
  addMember('kestrel'); f.kestrel = true;
  await fadeTo(0, 300);
  await sayAll([
    [KE, 'Pleasure doing business. Don\'t look so surprised, Captain — I was going to break out tomorrow anyway.'],
    [KE, 'The old tunnel opens north of town, past the snow, in a ring of mountains. Try to keep up.']
  ]);
  Audio_.sfx('levelup');
  await narrate('Kestrel joined the party!');
  refreshEntities();
}

async function talkOrrin() {

  if (!f.q_hammer) {
    await sayAll([['Orrin', 'You\'re the ones going into Emberdeep? Then hear an old dwarf\'s request.'], ['Orrin', 'My family\'s forge-hammer, the Stonebrand, was left in the second hall when the shafts started screaming. Bring it home and I\'ll make it worth your while.']]);

  }
  if (hasItem('stonebrand') && !f.hammer_done) {
    await sayAll([['Orrin', 'The Stonebrand! Look at her. Not a scratch. Well — one scratch. That one\'s from my grandfather.'], ['Orrin', 'Take this band. Forged by my own hand, with this very hammer, a long time ago. It keeps a clear head.']]);

  }

    ['Orrin', 'My grandfather\'s grandfather carried the Stone Lantern down into Emberdeep. We built the city on top of it, so it would keep us warm forever.'],
    ['Orrin', G.flags.lantern3 ? 'And now it does again. Thank you, children.' : '"Forever." Ha. Now the halls are dark and something walks in them wearing our dead.']

async function talkHilda() { await say('Hilda', 'Steel from the forges of Ironhold! Finest blades north of the sea. Step inside the smithy if you want to buy.'); }
async function talkMiner() { await say('Miner', 'The Revenants down there... they wear dwarf armor. Holy light sends them back to rest, they say.'); }

async function doorEvent(townId, b) {
  Audio_.sfx('door');
  return enterInterior(townId, b);
}
async function oldDoorEvent(townId, b) {
  if (b.kind === 'inn') return innStay(townId, b.price);
  if (b.shop) return openShop(b.shop, b.sign === 'arms' ? (townId === 'ironhold' ? 'Hilda the Smith' : 'Armorer') : 'Shopkeeper');
  if (townId === 'brightwater' && b.id === 'arinhouse') {
    const c = await choose(null, 'Your home. The hearth is still warm. Rest a while?', ['Rest', 'Leave'], 1);
    if (c === 0) {
      await fadeTo(1, 500); Audio_.sfx('inn'); healAll(); G.lastInn = { town: 'brightwater' }; await wait(1200); await fadeTo(0, 500);
      await narrate('You slept in your own bed. HP and MP restored.');
    }
    return;
  }
  if (townId === 'brightwater' && b.id === 'hall') { await narrate('Elder Maren\'s hall. The elder is out in the square, by the gate to the hall.'); return; }
  if (townId === 'halden' && b.id === 'chapel') {
    if (!G.flags.oswin) { await joinOswin(); return; }
    await say('Sister Wenna', 'May the tide carry your burdens. Rest a moment in the Sea Mother\'s house.');
    Audio_.sfx('heal'); for (const m of G.party) { if (!alive(m)) m.hp = 1; m.status = {}; }
    await narrate('Fallen allies were revived.');
    return;
  }
  if (townId === 'halden' && b.id === 'harbor') return talkBrann();
  if (townId === 'ironhold' && b.id === 'jail') {
    if (G.flags.kestrel) { await narrate('An empty cell. Someone has scratched "K WUZ HERE" into the wall.'); return; }
    if (G.flags.metKestrel) { await say('Kestrel', 'Still here. Still bored. Captain Dunmar, remember? Bring the priest. Captains love priests.'); return; }
    await sayAll([
      ['Prisoner', 'Visitors! You don\'t look like guards. You look like... adventurers. Ugh.'],
      [KE, 'Name\'s Kestrel. They caught me with a map of Emberdeep. The real one — with the smugglers\' tunnel the dwarves never sealed.'],
      [KE, 'You want into those mines? Get me out of here, and I\'ll get you in. Talk to Captain Dunmar. Bring the priest. Captains love priests.']
    ]);
    G.flags.metKestrel = true; refreshEntities();
    return;
  }
  if (townId === 'ironhold' && b.id === 'barracks') return talkDunmar();
  if (townId === 'frostmere' && b.id === 'wren') return talkWren();
  if (townId === 'frostmere' && b.id === 'sable') return talkSable();
  if (townId === 'ironhold' && b.id === 'house1' && hasItem('stonebrand')) return talkOrrin();
  await narrate(pick(['Nobody answers. You hear someone humming inside.', 'The door is locked. It smells of fresh bread.', 'A dog barks at you from behind the door.']));
}
async function onEnterTown(id) {
  const f = G.flags;
  if (id === 'halden' && !f.seenHalden) { f.seenHalden = true; await say(LY, 'Port Halden! Smell that salt air. Elder Maren said to look for a priest named Oswin — he must be near the chapel.'); }

// ------------- world flags -------------
function applyWorldFlags(m) {
  if (!m || m.kind !== 'world') return;
  if (G.flags.isle && !m.isleUp && m.isle) { for (const [x, y, c] of m.isle) { m.set(x, y, c); m.region[y][x] = 'H'; } m.isleUp = true; }
  if (G.flags.bridge) { const rx = riverX(BRIDGE_Y); m.set(rx, BRIDGE_Y, 'b'); m.set(rx + 1, BRIDGE_Y, 'b'); }
  if (G.flags.ship && !G.ship) G.ship = { x: SHIP_HOME.x, y: SHIP_HOME.y, dir: 'right' };
}

    'about who got the bigger half.'
  ];
  for (const s of lines) { BlackScene.lines.push({ s, at: BlackScene.t }); await wait(2600); }
  BlackScene.lines.push({ s: '— Chapter VI: The Crownless King · Complete —', at: BlackScene.t });
  await wait(3200);
  await fadeTo(1, 1000);
  G.scene = Field; Field.playMusic();
  await fadeTo(0, 800);
  await narrate('The Eclipse Cup is now open at the Aerie Arena.');
  const c = await choose(null, 'Record your journey?', ['Save', 'Not now'], 0);
  if (c === 0 && saveGame()) { Audio_.sfx('save'); await narrate('Your journey has been recorded.'); }

async function arenaMenu() {
  const f = G.flags;
  const cups = ARENA_CUPS.filter(c => !c.unlock || f[c.unlock]);
  if (!f.arenaMet) { f.arenaMet = true; await sayAll([['Arena Master', 'Challengers! Five cups. Each is a gauntlet — several battles back to back, no inn between rounds. Items are allowed. Running is not.'], ['Arena Master', 'Win, and the prize is yours. Lose, and our healers drag you out. No shame in it. Well — a little shame.']]); }
  while (true) {
    const items = cups.map(c => ({ label: c.name + (f['cup_' + c.id] ? '  ✓' : ''), right: 'Lv ' + c.level + '+', color: f['cup_' + c.id] ? '#9adf9a' : '#fff' }));
    items.push({ label: 'Leave' });
    const k = await listMenu({ x: 150, y: 90, w: 340, rows: 7, title: 'Aerie Arena', items, help: i => i < cups.length ? `${cups[i].rounds.length} rounds · Prize: ${ITEMS[cups[i].prize].name} + ${cups[i].gold} G${f['cup_' + cups[i].id] ? ' (won — rematch for gold only)' : ''}` : '' });
    if (k < 0 || k === cups.length) break;
    const cup = cups[k];
    const c = await choose('Arena Master', `The ${cup.name}: ${cup.rounds.length} battles in a row. Ready?`, ['Fight!', 'Not yet'], 1);
    if (c !== 0) continue;
    let won = true;
    for (let r = 0; r < cup.rounds.length; r++) {
      await narrate(`${cup.name} — Round ${r + 1} of ${cup.rounds.length}. FIGHT!`);
      const grp = cup.rounds[r], boss = grp.some(id => MONSTERS[id].boss);
      const res = await startBattle(grp, { bg: 'arena', arena: true, boss, canRun: false });
      if (res !== 'win') { won = false; break; }
    }
    if (!won) { healAll(); await say('Arena Master', 'Carried out on a stretcher! ...Patched up, good as new. Come back any time.'); continue; }
    Audio_.sfx('levelup');
    G.gold += cup.gold;
    if (!f['cup_' + cup.id]) { f['cup_' + cup.id] = true; addItem(cup.prize); await narrate(`Champions of the ${cup.name}! Received ${ITEMS[cup.prize].name} and ${cup.gold} gold!`); }
    else await narrate(`Champions again! Received ${cup.gold} gold.`);
    if (cup.id === 'champion') await say('Arena Master', 'GRAND CHAMPIONS! In a thousand years, nobody has worn that crown. Aerie will sing about you until the wind stops.');
    if (cup.id === 'eclipse') await say('Arena Master', 'You beat a KING. In my arena. I\'m having that painted on the ceiling. Possibly on my face.');
  }
}

  if (!f.lantern2) return { text: 'Relight the Tide Lantern in the Sunken Shrine, south of Port Halden.', loc: '2' };
  if (!f.ship) return { text: 'Ask harbor master Brann in Port Halden about a ship.', loc: 'B' };
  if (!f.kestrel) return { text: f.metKestrel ? 'Ask Captain Dunmar in Ironhold to release Kestrel.' : 'Sail north to Ironhold and find a way into Emberdeep.', loc: 'C' };
  if (!f.lantern3) return { text: 'Relight the Stone Lantern deep in Emberdeep Mines.', loc: '3' };
  if (!f.ending) return { text: 'Sail east to the Isle of Dusk and climb the Hollow Spire.', loc: '4' };
  if (f.isle && !f.q_crown) return { text: 'Chapter VI: Sail or fly to the island that rose in the far northeast sea.', loc: 'G' };
  if (f.isle && !f.boss_abyss) return { text: 'Chapter VI: Descend the Crownfall Abyss, in the crater east of Lastlight. (Lv 42+)', loc: '7' };
  if (!f.isle) return { text: 'The Lanterns burn. Step out into the world and see the new dawn.', loc: null };
  return { text: 'Every Lantern burns, even the Night\'s. Legends still wait in the arena, the forge and the deep water.', loc: null };
}

// ------------- title -------------
const TitleScene = {
  t: 0, ready: false,
  tick(dt) { this.t += dt; }, update() { },
  draw(g) {
    drawTitleArt(g, this.t);
    const a = clamp(this.t / 2, 0, 1);
    g.save(); g.globalAlpha = a;
    g.font = font(64, true, SERIF);
    const gr = g.createLinearGradient(0, 70, 0, 140); gr.addColorStop(0, '#fff4c8'); gr.addColorStop(1, '#e8a84a');
    g.textAlign = 'center'; g.textBaseline = 'top';
    g.fillStyle = 'rgba(0,0,0,.5)'; g.fillText('LANTERNFALL', W / 2 + 3, 83);
    g.fillStyle = gr; g.fillText('LANTERNFALL', W / 2, 80);
    text(g, 'A Tale of the Four Flames', W / 2, 152, { size: 18, fam: SERIF, align: 'center', color: '#e8dcc8' });
    g.restore();
    text(g, 'Arrows/WASD move · Enter/Z confirm · Esc/X menu & back · M sound', W / 2, H - 22, { size: 12, align: 'center', color: 'rgba(220,220,255,.6)' });
  }
};
async function titleMenu() {
  G.scene = TitleScene; TitleScene.t = 0;
  Audio_.play('title');
  await fadeTo(0, 600);
  while (true) {
    const ngp = saveFlag('ending');
    const items = [{ label: 'New Game' }, { label: 'Continue', disabled: !hasSave() }, { label: ngp ? `New Game+ (${(saveFlag('ngplus') || 0) + 1})` : 'New Game+', disabled: !ngp }, { label: Audio_.muted ? 'Sound: Off' : 'Sound: On' }];
    const k0 = await listMenu({ x: W / 2 - 100, y: 190, w: 200, rows: 4, items, cancel: false, index: hasSave() ? 1 : 0, help: i => i === 2 ? (ngp ? 'Keep your levels, gear and items. Enemies grow stronger.' : 'Finish the story to unlock New Game+.') : '' , helpY: H - 60 });
    const k = k0 === 3 ? 2 : k0 === 2 ? 3 : k0;
    if (k === 3) { await newGamePlus(); return; }
    if (k === 0) { await newGame(); return; }
    if (k === 1) {
      if (loadGame()) {
        await fadeTo(1, 500);
        G.maps = {};
        Field.enter(G.mapId, G.x, G.y, G.dir);
        await fadeTo(0, 500);
        if (G.mapId === 'world') await worldEvents();
        return;
      }
    }
    if (k === 2) Audio_.toggleMute();
  }
}
const BlackScene = { lines: [], t: 0, tick(dt) { this.t += dt; }, update() { }, draw(g) { g.fillStyle = '#05040c'; g.fillRect(0, 0, W, H); this.lines.forEach((l, i) => { g.save(); g.globalAlpha = clamp((this.t - l.at) / 1.2, 0, 1); text(g, l.s, W / 2, 130 + i * 44, { size: 20, fam: SERIF, align: 'center', color: '#e8dcc8' }); g.restore(); }); } };
function saveFlag(k) { try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); return d && d.flags ? d.flags[k] : null; } catch (e) { return null; } }
async function newGamePlus() {
  if (!loadGame()) return newGame();
  const carry = {}; G.party.forEach(m => carry[m.id] = { ...m, status: {} });
  const inv = {}; for (const k in G.inv) if (ITEMS[k] && ITEMS[k].kind !== 'key') inv[k] = G.inv[k];
  for (const m of G.party) for (const sl of ['weapon', 'armor', 'acc']) if (m[sl]) { /* equipped gear stays on the carried member */ }
  await newGame({ carry, inv, gold: G.gold, seen: G.seen, killed: G.killed, ng: (G.flags.ngplus || 0) + 1 });
}
async function newGame(plus) {
  await fadeTo(1, 700);
  Object.keys(G.flags).forEach(k => delete G.flags[k]);
  G.carry = plus ? plus.carry : null;
  G.party = [];
  if (plus) { G.party.push({ ...G.carry.arin, status: {} }, { ...G.carry.lyra, status: {} }); healAll(); }
  else G.party = [makeMember('arin', 1), makeMember('lyra', 1)];
  G.inv = plus ? plus.inv : { potion: 2 }; G.gold = plus ? plus.gold : 80; G.playTime = 0; G.maps = {}; G.ship = null; G.onShip = false; G.airship = null; G.inAir = false; G.lastInn = { town: 'brightwater' };
  G.seen = plus ? plus.seen : {}; G.killed = plus ? plus.killed : {};
  if (plus) G.flags.ngplus = plus.ng;
  G.scene = BlackScene; BlackScene.lines = []; BlackScene.t = 0;
  await fadeTo(0, 400);
  const story = ['Long ago, the Hollow Night swallowed the world.', 'Four Lanterns were lit to chain it beneath the earth —', 'Ember, Tide, Stone, and Dawn.', 'For a thousand years, their flames held.', '...Until tonight.'];
  for (const s of story) { BlackScene.lines.push({ s, at: BlackScene.t }); await wait(2300); }
  await wait(800);
  await fadeTo(1, 900);
  Field.enter('brightwater', 11, 11, 'up');
  Audio_.play('town', true);
  await fadeTo(0, 900);
  await sayAll([
    [LY, 'Arin! Arin — did you see the sky over Whisperwood?! It went black. Not night-black. Hollow-black.'],
    [A, '...The Ember Lantern.'],
    [LY, 'Elder Maren\'s calling for you. "Lamplighter\'s duty," she says. She\'s waiting by her hall, on the west side of the square.'],
    [LY, 'And before you say anything — I\'m coming with you. Selene always said the Lanterns sing at night. If one\'s gone quiet... I want to know why.']
  ]);
  await narrate('Lyra joins you. Talk to people with Enter. Open the menu with Esc.');
  refreshEntities();
}

// ------------- ending -------------
const EndingScene = {
  t: 0, lines: [], done: false,
  tick(dt) { this.t += dt; }, update() { },
  draw(g) {
    const k = clamp(this.t / 20, 0, 1);
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, `rgb(${lerp(20, 120, k) | 0},${lerp(10, 160, k) | 0},${lerp(50, 230, k) | 0})`);
    gr.addColorStop(0.7, `rgb(${lerp(80, 255, k) | 0},${lerp(30, 190, k) | 0},${lerp(80, 140, k) | 0})`);
    gr.addColorStop(1, '#2a1830');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    const sy = lerp(420, 250, k);
    g.save(); g.globalAlpha = 0.4; circle(g, W / 2, sy, 120, '#ffe8a0'); g.restore();
    circle(g, W / 2, sy, 50, '#fff4d0');
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + this.t * 0.05; line(g, W / 2 + Math.cos(a) * 60, sy + Math.sin(a) * 60, W / 2 + Math.cos(a) * 140, sy + Math.sin(a) * 140, 'rgba(255,240,200,.25)', 4); }
    g.fillStyle = '#1a1028'; g.fillRect(0, 330, W, H - 330);
    for (let r = 0; r < 6; r++) { g.strokeStyle = `rgba(255,220,160,${0.15 + 0.05 * Math.sin(this.t + r)})`; g.lineWidth = 2; g.beginPath(); g.moveTo(W / 2 - 40 - r * 20, 340 + r * 12); g.lineTo(W / 2 + 40 + r * 20, 340 + r * 12); g.stroke(); }
    // party silhouettes on a cliff
    g.beginPath(); g.moveTo(0, 360); g.quadraticCurveTo(160, 330, 300, 350); g.lineTo(300, H); g.lineTo(0, H); g.fillStyle = '#0c0814'; g.fill();
    const ids = ['arin', 'lyra', 'oswin', 'kestrel'];
    ids.forEach((id, i) => drawChar(g, HEROES[id].look, 90 + i * 44, 348 - (i === 1 ? 2 : 0), 'up', 0, 1.4));
    drawChar(g, LOOKS.selene, 270, 352, 'up', 0, 1.4);
    this.lines.forEach((l, i) => {
      g.save(); g.globalAlpha = clamp((this.t - l.at) / 1.5, 0, 1) * clamp((l.end - this.t) / 1.5, 0, 1);
      wrapText(g, l.s, 520, font(19, false, SERIF)).forEach((s, j) => text(g, s, W / 2, 40 + j * 28, { size: 19, fam: SERIF, align: 'center', color: '#fff8e8' }));
      g.restore();
    });
    if (this.done) {
      g.save(); g.globalAlpha = clamp((this.t - this.doneAt) / 2, 0, 1);
      text(g, 'THE END', W / 2, 110, { size: 54, bold: true, fam: SERIF, align: 'center', color: '#fff4c8' });
      text(g, 'Thank you for playing LANTERNFALL', W / 2, 180, { size: 18, fam: SERIF, align: 'center', color: '#fff8e8' });
      g.restore();
    }
  }
};
async function runEnding() {
  G.flags.ending = true;
  await fadeTo(1, 1500, '#fff');
  G.scene = EndingScene; EndingScene.t = 0; EndingScene.lines = []; EndingScene.done = false;
  Audio_.play('ending', true);
  await fadeTo(0, 2000, '#fff');
  const ep = [
    'The Dawn Lantern blazed atop the Spire, and for the first time in an age, the sun rose over the Isle of Dusk.',
    'Oswin returned to Port Halden. He still dreams — mostly of fish now, which he takes as a very good sign.',
    'Kestrel "misplaced" the map of Emberdeep. The Undercity of Ironhold has a new, suspiciously honest guardian.',
    'Selene came home to Brightwater. On quiet nights, she and Lyra sit beside the Ember Lantern and listen to it sing.',
    'And Arin, last of the lamplighters, walks the four roads every year to tend the flames —',
    'so the dark never forgets who keeps the light.'
  ];
  for (const s of ep) {
    const at = EndingScene.t;
    EndingScene.lines = [{ s, at, end: at + 6.5 }];
    await wait(7000);
  }
  EndingScene.lines = [];
  EndingScene.done = true; EndingScene.doneAt = EndingScene.t;
  await wait(3000);
  saveGame();
  await UI.push({ update() { if (Input.p('ok')) UI.close(this); }, draw(g) { if (Math.sin(performance.now() / 300) > 0) text(g, 'Press Enter', W / 2, H - 40, { size: 15, align: 'center', color: '#fff8e8' }); } });
  await fadeTo(1, 1500);
  runScript(titleMenu);
}

// ------------- main loop -------------
let lastT = performance.now();
function frame(now) {
  try { frameInner(now); } catch (e) { if (!frame.seen) frame.seen = new Set(); if (!frame.seen.has(String(e))) { frame.seen.add(String(e)); console.error(e); } }
  requestAnimationFrame(frame);
}
function frameInner(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  Input.update(dt);
  if (Input.p('mute')) Audio_.toggleMute();
  updateTimers(dt); updateFade(dt);
  const uiBusy = UI.update(dt);
  if (!uiBusy && !Script.running && G.scene && G.scene.update) G.scene.update(dt);
  if (G.scene && G.scene.tick) G.scene.tick(dt);
  ctx.setTransform(SCALE * DPR, 0, 0, SCALE * DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (G.scene) G.scene.draw(ctx);
  UI.draw(ctx);
  drawToasts(ctx, dt);
  if (Fade.v > 0) { ctx.save(); ctx.globalAlpha = Fade.v; ctx.fillStyle = Fade.color; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}
Fade.v = 1;
G.scene = TitleScene;
requestAnimationFrame(frame);
runScript(titleMenu);

</script>
