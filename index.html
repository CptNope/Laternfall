<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lanternfall — A Tale of the Four Flames</title>
<meta name="description" content="A complete 16-bit-style JRPG that runs in your browser. No downloads, no image or audio files.">
<meta name="theme-color" content="#07060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#05040c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:auto;box-shadow:0 0 60px rgba(120,90,200,.25)}
#touch{display:none;position:fixed;inset:0;pointer-events:none}
#touch .b{position:absolute;pointer-events:auto;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);color:rgba(255,255,255,.8);font:bold 18px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;border-radius:12px;touch-action:none}
#touch .b.on{background:rgba(255,255,255,.35)}
#touch .d{width:54px;height:54px}
#touch .r{width:66px;height:66px;border-radius:50%}
#touch .s{width:46px;height:46px;border-radius:50%;font-size:15px}
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<div id="touch">
  <div class="b d" data-a="up" style="left:70px;bottom:136px">▲</div>
  <div class="b d" data-a="left" style="left:14px;bottom:80px">◀</div>
  <div class="b d" data-a="right" style="left:126px;bottom:80px">▶</div>
  <div class="b d" data-a="down" style="left:70px;bottom:24px">▼</div>
  <div class="b r" data-a="ok" style="right:20px;bottom:90px">A</div>
  <div class="b r" data-a="cancel" style="right:96px;bottom:40px">B</div>
  <div class="b s" data-a="run" style="right:30px;bottom:170px" title="Run / repeat last turn">R</div>
</div>
<script>
// LANGUAGES: written by build.py from content/lang/*.json (and mods). Edit those files, not this.
const LANG_PACKS = {};

'use strict';
// ============================================================
//  LANGUAGES (2.0, EN-6). Player-facing text is written in English, wrapped in tl():
//    tl('Welcome to Brightwater.')         a plain line
//    tl`${name} found ${n} gold!`          a line with values: the key is "{0} found {1} gold!"
//  (tl, not t: plenty of drawing code keeps the time in a local t.)
//  tl() looks the English up in the active language and falls back to English, so the code
//  stays readable and an untranslated line still works. Language files are content/lang/*.json
//  ({ "name": "Español", "strings": { "English": "translation" } }); build.py puts them in
//  LANG_PACKS. A translation may reorder the values: "{1} de oro para {0}".
//  The language is chosen once, when the game loads (?lang=xx, else the saved choice, else
//  English); changing it in Settings reloads the game. "pseudo" is a test language that
//  changes every translated line, so English left untranslated stands out (docs/TESTING.md).
// ============================================================
const LANG_KEY = 'lanternfall_lang';
const LANG = (() => {
  const url = /[?&]lang=([\w-]+)/.exec(location.search);
  let code = url ? url[1] : null;
  if (!code) { try { code = localStorage.getItem(LANG_KEY); } catch (e) { } }
  return code && (code === 'pseudo' || code === 'en' || LANG_PACKS[code]) ? code : 'en';
})();
// the lines of the active language (English has an empty pack, which a mod can use to reword)
const LANG_STRINGS = (LANG_PACKS[LANG] && LANG_PACKS[LANG].strings) || {};
// Pseudo: accent every letter, keep {0} values and line breaks, and pad by a third, so missed
// lines and text too long for its box both show up on screen.
// every letter has an accented twin, so a plain ASCII letter on screen is always untranslated
const PSEUDO_MAP = { a: 'å', b: 'ƀ', c: 'ç', d: 'đ', e: 'é', f: 'ƒ', g: 'ĝ', h: 'ĥ', i: 'î', j: 'ĵ', k: 'ķ', l: 'ļ', m: 'ɱ', n: 'ñ', o: 'ö', p: 'þ', q: 'ʠ', r: 'ŕ', s: 'š', t: 'ţ', u: 'ü', v: 'ṽ', w: 'ŵ', x: 'ẋ', y: 'ý', z: 'ž', A: 'Å', B: 'Ɓ', C: 'Ç', D: 'Đ', E: 'É', F: 'Ƒ', G: 'Ĝ', H: 'Ĥ', I: 'Î', J: 'Ĵ', K: 'Ķ', L: 'Ļ', M: 'Ṁ', N: 'Ñ', O: 'Ö', P: 'Þ', Q: 'Ǫ', R: 'Ŕ', S: 'Š', T: 'Ţ', U: 'Ü', V: 'Ṽ', W: 'Ŵ', X: 'Ẋ', Y: 'Ý', Z: 'Ž' };
function pseudo(s) {
  if (!/[A-Za-z]/.test(s)) return s;
  const body = s.replace(/\{\d+\}|[A-Za-z]/g, m => m.length > 1 ? m : PSEUDO_MAP[m] || m);
  const pad = '·'.repeat(Math.ceil(s.replace(/\{\d+\}/g, '').length / 3));
  return '⟦' + body + pad + '⟧';
}
const T_CACHE = new Map(), T_KEYS = new WeakMap();
const T_SEEN = LANG === 'pseudo' ? new Set() : null;   // the keys asked for, so a test can check the template has them all
function lookup(key) {
  if (T_SEEN) T_SEEN.add(key);
  let v = T_CACHE.get(key);
  if (v === undefined) {
    v = LANG === 'pseudo' ? pseudo(key) : (typeof LANG_STRINGS[key] === 'string' && LANG_STRINGS[key]) || key;
    T_CACHE.set(key, v);
  }
  return v;
}
function tl(s, ...vals) {
  if (Array.isArray(s) && s.raw) {   // t`…${x}…`
    let key = T_KEYS.get(s);
    if (!key) { key = s[0]; for (let i = 1; i < s.length; i++) key += '{' + (i - 1) + '}' + s[i]; T_KEYS.set(s, key); }
    return lookup(key).replace(/\{(\d+)\}/g, (m, i) => +i < vals.length ? String(vals[+i]) : m);
  }
  return typeof s === 'string' ? lookup(s) : s;
}
// The languages to offer in Settings: English, every pack, and pseudo only when asked for
function languages() {
  const out = [['en', 'English']];
  for (const [code, p] of Object.entries(LANG_PACKS)) if (code !== 'en') out.push([code, p.name || code]);
  if (LANG === 'pseudo') out.push(['pseudo', tl('Pseudo (test)')]);
  return out;
}
function setLanguage(code) { try { localStorage.setItem(LANG_KEY, code); } catch (e) { } location.reload(); }
// content/*.json is data, not code: its names and descriptions are translated here, once loaded
function translateContent() {
  if (LANG === 'en' && !Object.keys(LANG_STRINGS).length) return;
  for (const it of Object.values(ITEMS)) { it.name = tl(it.name); it.desc = tl(it.desc); }
  for (const m of Object.values(MONSTERS)) { m.name = tl(m.name); for (const p of m.phases || []) p.msg = tl(p.msg); }
  for (const tw of Object.values(TOWN_DEFS)) tw.name = tl(tw.name);
}

'use strict';
// ============================================================
//  LANTERNFALL — core: canvas, utils, input, UI, scripting, audio
// ============================================================
const W = 640, H = 480, TS = 32, VW = 20, VH = 15;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let SCALE = 1, DPR = 1, SIDE_PANEL = 0;   // the editor's panel takes SIDE_PANEL pixels on the right
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min((window.innerWidth - SIDE_PANEL) / W, window.innerHeight / H);
  SCALE = s;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.round(W * s * DPR);
  cv.height = Math.round(H * s * DPR);
}
window.addEventListener('resize', resize);
resize();

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function hash(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
}
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function weighted(list, r = Math.random()) {
  let tot = 0; for (const it of list) tot += it.w;
  let v = r * tot;
  for (const it of list) { v -= it.w; if (v <= 0) return it; }
  return list[list.length - 1];
}
function shade(hex, amt) { // amt -1..1
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
  let r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  if (amt > 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function rgba(hex, a) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
  return `rgba(${parseInt(c.substr(0, 2), 16)},${parseInt(c.substr(2, 2), 16)},${parseInt(c.substr(4, 2), 16)},${a})`;
}

// world-map location tiles: towns A–G, dungeons 1–9
const LOC_RE = /^[A-I0-9]$/;   // A–G towns and 1–9 dungeons on the world; H, I and 0 on the sea floor (1.7)
const isLoc = c => typeof c === 'string' && LOC_RE.test(c);

// ---------- settings (persist separately from the save file) ----------
const CFG_KEY = 'lanternfall_cfg_v1';
const BATTLE_SPEEDS = [{ label: '1×', v: 1 }, { label: '2×', v: 2 }, { label: '4×', v: 4 }];
const TEXT_SPEEDS = [{ label: tl('Normal'), v: 55 }, { label: tl('Fast'), v: 120 }, { label: tl('Instant'), v: 99999 }];
const CFG = { dash: false, textSpeed: 0, muted: false, autosave: true, battleSpeed: 0, noEnc: false, bigText: false, contrast: false, keys: null, speedrun: false, battery: false };
function loadCfg() { try { Object.assign(CFG, JSON.parse(localStorage.getItem(CFG_KEY)) || {}); } catch (e) { } }
loadCfg();
function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (e) { } }

// ---------- input ----------
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Enter: 'ok', Space: 'ok', KeyZ: 'ok', KeyE: 'ok', NumpadEnter: 'ok',
  Escape: 'cancel', KeyX: 'cancel', Backspace: 'cancel', KeyQ: 'cancel', KeyC: 'cancel',
  KeyM: 'mute', ShiftLeft: 'run', ShiftRight: 'run'
};
const DEFAULT_KEYMAP = { ...KEYMAP };
// CFG.keys holds the player's bindings as { code: action }; it replaces the defaults entirely
function applyKeymap() { for (const k in KEYMAP) delete KEYMAP[k]; Object.assign(KEYMAP, CFG.keys || DEFAULT_KEYMAP); }
applyKeymap();
const KeyCapture = { cb: null };   // set while the Controls page waits for a key
const ACTIONS = ['up', 'down', 'left', 'right', 'ok', 'cancel', 'mute', 'run'];
const REPEAT = new Set(['up', 'down', 'left', 'right']);
// Standard-mapping gamepads: D-pad or left stick, A ok, B cancel, X run, Y/Start menu, Select mute
const PAD_BUTTONS = { 12: 'up', 13: 'down', 14: 'left', 15: 'right', 0: 'ok', 1: 'cancel', 3: 'cancel', 9: 'cancel', 2: 'run', 8: 'mute' };
const Input = {
  down: {}, vdown: {}, tapped: {}, hold: {}, fired: {}, pad: {}, anyKey: false,
  pollPad() {
    this.pad = {};
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) {
      if (!gp) continue;
      gp.buttons.forEach((b, i) => { if (b.pressed && PAD_BUTTONS[i]) this.pad[PAD_BUTTONS[i]] = true; });
      const [ax, ay] = gp.axes;
      if (ax < -0.5) this.pad.left = true; if (ax > 0.5) this.pad.right = true;
      if (ay < -0.5) this.pad.up = true; if (ay > 0.5) this.pad.down = true;
    }
    if (Object.keys(this.pad).length) Audio_.unlock();
  },
  update(dt) {
    this.pollPad();
    for (const a of ACTIONS) {
      const d = this.down[a] || this.vdown[a] || this.tapped[a] || this.pad[a];
      if (d) {
        const h = this.hold[a] || 0, nh = h + dt;
        const R0 = 0.3, RI = 0.08;
        this.fired[a] = h === 0 || (REPEAT.has(a) && nh > R0 && Math.floor((nh - R0) / RI) > Math.floor(Math.max(0, h - R0) / RI));
        this.hold[a] = nh;
      } else { this.fired[a] = false; this.hold[a] = 0; }
      this.tapped[a] = false;
    }
  },
  p(a) { return !!this.fired[a]; },
  h(a) { return !!(this.down[a] || this.vdown[a] || this.pad[a]); },
  clear() { for (const a of ACTIONS) this.fired[a] = false; }
};
window.addEventListener('keydown', e => {
  if (KeyCapture.cb) { e.preventDefault(); const cb = KeyCapture.cb; KeyCapture.cb = null; cb(e.code); return; }
  const a = KEYMAP[e.code];
  Audio_.unlock();
  if (a) {
    e.preventDefault();
    if (!Input.down[a]) Input.tapped[a] = true;
    Input.down[a] = true;
  }
});
window.addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) Input.down[a] = false; });
window.addEventListener('blur', () => { Input.down = {}; Input.vdown = {}; });

// touch controls
(function setupTouch() {
  const pad = document.getElementById('touch');
  if (!pad) return;
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (!isTouch) return;
  pad.style.display = 'block';
  pad.querySelectorAll('[data-a]').forEach(el => {
    const a = el.dataset.a;
    const on = e => { e.preventDefault(); Audio_.unlock(); if (!Input.vdown[a]) Input.tapped[a] = true; Input.vdown[a] = true; el.classList.add('on'); };
    const off = e => { e.preventDefault(); Input.vdown[a] = false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  });
})();

// ---------- timers / tweens ----------
const Timers = [];
function wait(ms) { return new Promise(res => Timers.push({ t: ms / 1000, res })); }
function updateTimers(dt) {
  for (let i = Timers.length - 1; i >= 0; i--) {
    Timers[i].t -= dt;
    if (Timers[i].t <= 0) { const r = Timers[i].res; Timers.splice(i, 1); r(); }
  }
}
const Fade = { v: 0, target: 0, speed: 3, color: '#000', res: null };
function fadeTo(v, ms = 350, color = '#000') {
  Fade.target = v; Fade.speed = 1 / Math.max(0.01, ms / 1000); Fade.color = color;
  return new Promise(res => { Fade.res = res; if (Fade.v === v) { Fade.res = null; res(); } });
}
function updateFade(dt) {
  if (Fade.v !== Fade.target) {
    const d = Fade.speed * dt;
    Fade.v = Fade.v < Fade.target ? Math.min(Fade.target, Fade.v + d) : Math.max(Fade.target, Fade.v - d);
    if (Fade.v === Fade.target && Fade.res) { const r = Fade.res; Fade.res = null; r(); }
  }
}

// ---------- scripting ----------
const Script = { running: 0 };
async function runScript(fn) {
  Script.running++;
  try { await fn(); } catch (e) { console.error(e); }
  finally { Script.running--; }
}

// ---------- UI stack ----------
const UI = {
  stack: [],
  push(c) { return new Promise(res => { c._res = res; this.stack.push(c); }); },
  close(c, v) { const i = this.stack.indexOf(c); if (i >= 0) this.stack.splice(i, 1); if (c._res) c._res(v); },
  top() { for (let i = this.stack.length - 1; i >= 0; i--) if (!this.stack[i].passive) return this.stack[i]; return null; },
  update(dt) {
    for (const c of this.stack) if (c.tick) c.tick(dt);
    const t = this.top();
    if (t) { t.update(dt); Input.clear(); return true; }
    return false;
  },
  draw(g) { for (const c of this.stack) c.draw(g); }
};

const FONT = '"Trebuchet MS", "Segoe UI", Verdana, sans-serif';
const SERIF = 'Georgia, "Times New Roman", serif';
function font(px, bold = false, fam = FONT) { return `${bold ? 'bold ' : ''}${px}px ${fam}`; }

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function drawWindow(g, x, y, w, h, alpha = 0.94) {
  g.save();
  g.globalAlpha = alpha;
  const gr = g.createLinearGradient(0, y, 0, y + h);
  if (CFG.contrast) { gr.addColorStop(0, '#000'); gr.addColorStop(1, '#000'); g.globalAlpha = 1; }
  else { gr.addColorStop(0, '#2b4bb8'); gr.addColorStop(1, '#0c1650'); }
  roundRect(g, x, y, w, h, 7); g.fillStyle = gr; g.fill();
  g.globalAlpha = 1;
  g.lineWidth = 3; g.strokeStyle = CFG.contrast ? '#ffe24a' : '#e9eefc'; g.stroke();
  roundRect(g, x + 3.5, y + 3.5, w - 7, h - 7, 5); g.lineWidth = 1; g.strokeStyle = 'rgba(120,150,255,.55)'; g.stroke();
  g.restore();
}
function text(g, s, x, y, o = {}) {
  g.font = o.font || font(o.size || 16, o.bold, o.fam);
  g.textAlign = o.align || 'left';
  g.textBaseline = o.base || 'top';
  if (o.shadow !== false) { g.fillStyle = 'rgba(0,0,0,.6)'; g.fillText(s, x + 1.5, y + 1.5); }
  g.fillStyle = o.color || '#fff';
  g.fillText(s, x, y);
}
function wrapText(g, s, maxW, f) {
  g.font = f;
  const out = [];
  for (const para of String(s).split('\n')) {
    const words = para.split(' ');
    let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function drawCursor(g, x, y, t = performance.now() / 1000) {
  const o = Math.sin(t * 8) * 2;
  g.save(); g.translate(x + o, y);
  g.beginPath(); g.moveTo(-10, -7); g.lineTo(2, 0); g.lineTo(-10, 7); g.lineTo(-7, 0); g.closePath();
  g.fillStyle = '#fff'; g.strokeStyle = '#223'; g.lineWidth = 1.5; g.fill(); g.stroke();
  g.restore();
}
function bar(g, x, y, w, h, v, col, back = 'rgba(0,0,0,.5)') {
  g.fillStyle = back; g.fillRect(x, y, w, h);
  g.fillStyle = col; g.fillRect(x, y, w * clamp(v, 0, 1), h);
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1);
}

// Dialog box with typewriter + optional choices
class Dialog {
  constructor(name, msg, opts = {}) {
    this.name = name; this.opts = opts;
    this.big = !!CFG.bigText;
    this.f = font(this.big ? 21 : 17);
    this.pages = [];
    const lines = wrapText(ctx, msg, W - 80, this.f);
    for (let i = 0; i < lines.length; i += 3) this.pages.push(lines.slice(i, i + 3));
    this.page = 0; this.chars = 0; this.choices = opts.choices || null; this.ci = 0;
    this.top = !!opts.top; this.speed = opts.speed || (TEXT_SPEEDS[CFG.textSpeed] || TEXT_SPEEDS[0]).v;
  }
  get pageText() { return this.pages[this.page].join('\n'); }
  done() { return this.chars >= this.pageText.length; }
  update(dt) {
    const before = Math.floor(this.chars);
    this.chars = Math.min(this.pageText.length, this.chars + dt * this.speed);
    if (Math.floor(this.chars) !== before && Math.floor(this.chars) % 3 === 0) Audio_.sfx('blip');
    const last = this.page === this.pages.length - 1;
    if (this.choices && last && this.done()) {
      if (Input.p('up')) { this.ci = (this.ci + this.choices.length - 1) % this.choices.length; Audio_.sfx('cursor'); }
      if (Input.p('down')) { this.ci = (this.ci + 1) % this.choices.length; Audio_.sfx('cursor'); }
      if (Input.p('ok')) { Audio_.sfx('ok'); UI.close(this, this.ci); }
      else if (Input.p('cancel') && this.opts.cancel !== undefined) { Audio_.sfx('cancel'); UI.close(this, this.opts.cancel); }
      return;
    }
    if (Input.p('ok') || Input.p('cancel')) {
      if (!this.done()) this.chars = this.pageText.length;
      else if (!last) { this.page++; this.chars = 0; Audio_.sfx('cursor'); }
      else UI.close(this, 0);
    }
  }
  draw(g) {
    const h = this.big ? 122 : 104, y = this.top ? 12 : H - h - 12, x = 12, w = W - 24;
    drawWindow(g, x, y, w, h);
    if (this.name) {
      g.font = font(15, true);
      const nw = g.measureText(this.name).width + 22;
      drawWindow(g, x + 10, y - 22, nw, 28);
      text(g, this.name, x + 21, y - 15, { size: 15, bold: true, color: '#ffe9a8' });
    }
    const lines = this.pageText.slice(0, Math.floor(this.chars)).split('\n');
    lines.forEach((l, i) => text(g, l, x + 22, y + 16 + i * (this.big ? 32 : 26), { font: this.f }));

function drawShip(g, cx, by, t, dir) {
  const bob = Math.sin(t * 3) * 1.5;
  g.save(); g.translate(cx, by + bob);
  if (dir === 'left') g.scale(-1, 1);
  ellipse(g, 0, 2, 16, 4, 'rgba(255,255,255,.35)');
  poly(g, [-15, -6, 15, -6, 11, 2, -11, 2], '#7a4a22', OUT, 1.2);
  g.fillStyle = '#a8763f'; g.fillRect(-14, -8, 28, 3);
  line(g, 0, -6, 0, -30, '#4a2a12', 2);
  poly(g, [1, -29, 13, -14, 1, -12], '#f4efe0', OUT, 1);
  poly(g, [-1, -27, -11, -14, -1, -12], '#e8e0cc', OUT, 1);
  poly(g, [0, -30, 8, -28, 0, -26], '#e8c24a');
  g.restore();
}

// ---------------- TOWN TILES ----------------
function drawTownTile(g, map, x, y, px, py, t) {
  const ch = map.at(x, y);
  const theme = map.theme;
  const base = () => {
    if (theme === 'ash') {
      fillGround(g, 'ashsand', px, py, x, y, t);
      if (hash(x, y, 41) < 0.12) { const p = 0.5 + 0.5 * Math.sin(t * 2 + x * 1.7 + y); g.strokeStyle = `rgba(255,120,50,${0.3 + p * 0.4})`; g.lineWidth = 1.3; g.beginPath(); g.moveTo(px + 6, py + 10); g.lineTo(px + 15, py + 17); g.lineTo(px + 11, py + 27); g.stroke(); }
      return;
    }
    if (theme === 'snow') { fillGround(g, 'snow', px, py, x, y, t); return; }
    if (theme === 'sand') { fillGround(g, 'desert', px, py, x, y, t); return; }
    if (theme === 'stone') { g.fillStyle = (x + y) % 2 ? '#8e938a' : '#888d84'; g.fillRect(px, py, TS, TS); if (hash(x, y) < .3) { g.fillStyle = '#7a7f76'; g.fillRect(px + hash(x, y, 1) * 26, py + hash(x, y, 2) * 26, 4, 3); } }
    else fillGround(g, 'grass', px, py, x, y, t);
  };
  switch (ch) {
    case ':': {
      g.fillStyle = theme === 'stone' ? '#a8a49a' : theme === 'ash' ? '#a09890' : theme === 'snow' ? '#cfd6e2' : theme === 'sand' ? '#d8b880' : '#d6c8a6'; g.fillRect(px, py, TS, TS);
      g.strokeStyle = theme === 'stone' || theme === 'ash' ? '#8a867c' : theme === 'snow' ? '#aeb8c8' : '#b8a882'; g.lineWidth = 1;
      const o = (y % 2) * 8;
      g.beginPath();
      for (let i = 0; i < 2; i++) { g.moveTo(px, py + i * 16 + 16); g.lineTo(px + TS, py + i * 16 + 16); }
      for (let i = 0; i < 3; i++) { g.moveTo(px + o + i * 16 - 8 + 8, py); g.lineTo(px + o + i * 16, py + 16); g.moveTo(px + o + i * 16 - 8, py + 16); g.lineTo(px + o + i * 16 - 8, py + 32); }
      g.stroke();
      break;
    }
    case 't': base(); if (theme === 'sand') drawPalm(g, px + 16, py + 31, 1.5, x + y, t); else drawTreeRound(g, px + 16, py + 30, 1.55, '#3f8a3a', '#2a6a2a', '#5fae50'); break;
    case 'm': { g.fillStyle = theme === 'sand' ? '#a8603a' : '#7a6a5a'; g.fillRect(px, py, TS, TS); poly(g, [px, py + TS, px + 4, py + 6, px + 28, py + 4, px + TS, py + TS], theme === 'sand' ? '#c8784a' : '#8f7f6f', OUT, 1); g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(px + 6, py + 6, 20, 3); break; }
    case 'P': base(); drawPine(g, px + 16, py + 31, 1.35, '#3a7a5a', '#245a40', theme === 'stone' || theme === 'snow'); break;
    case 'f': {
      base();
      const cols = ['#ff6a8a', '#ffd84a', '#ffffff', '#b07aff'];
      for (let i = 0; i < 5; i++) { const fx = px + 4 + hash(x, y, i) * 24, fy = py + 4 + hash(x, y, i + 5) * 24; circle(g, fx, fy, 2.2, cols[(i + x) % 4]); circle(g, fx, fy, .8, '#fff6'); }
      break;
    }
    case 'F': {
      base();
      g.fillStyle = '#c8a070'; g.strokeStyle = OUT; g.lineWidth = 1;
      g.fillRect(px, py + 14, TS, 3); g.fillRect(px, py + 22, TS, 3);
      for (let i = 0; i < 2; i++) { rrect(g, px + 4 + i * 16, py + 10, 5, 20, 1, '#d8b080', OUT, 1); }
      break;
    }
    case '~': drawWater(g, px, py, x, y, map, t); break;
    case 'p': {
      drawWater(g, px, py, x, y, null, t);
      g.fillStyle = '#a8763f'; g.fillRect(px, py + 1, TS, 30);
      g.strokeStyle = '#6a4522'; g.lineWidth = 1;
      for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(px, py + 1 + i * 8); g.lineTo(px + TS, py + 1 + i * 8); g.stroke(); }
      break;
    }
    case 'r': {
      g.fillStyle = '#5f574f'; g.fillRect(px, py, TS, TS);
      ellipse(g, px + 10, py + 12, 12, 10, '#8a7f73', OUT, 1);
      ellipse(g, px + 24, py + 22, 10, 9, '#7a7065', OUT, 1);
      ellipse(g, px + 8, py + 9, 4, 3, '#a89e92');
      break;
    }
    case 'w': { // well
      base();
      ellipse(g, px + 16, py + 22, 12, 7, '#8a8a8a', OUT, 1.2);
      ellipse(g, px + 16, py + 21, 8, 4, '#1a3a6a');
      line(g, px + 5, py + 21, px + 5, py + 2, '#6a4522', 2.5); line(g, px + 27, py + 21, px + 27, py + 2, '#6a4522', 2.5);
      poly(g, [px + 2, py + 4, px + 16, py - 4, px + 30, py + 4], '#a0402e', OUT, 1);
      break;
    }
    case 'l': { // lamp post
      base();
      line(g, px + 16, py + 30, px + 16, py + 6, '#2a2a30', 2.5);
      const f = 0.7 + 0.3 * Math.sin(t * 7 + x);
      g.save(); g.globalAlpha = 0.25 * f; circle(g, px + 16, py + 6, 14, '#ffd27a'); g.restore();
      rrect(g, px + 12, py + 1, 8, 9, 2, '#ffe9a0', '#2a2a30', 1.5);
      break;
    }
    case 'c': { // crates
      base();
      rrect(g, px + 4, py + 12, 14, 14, 1, '#b8844a', OUT, 1); line(g, px + 4, py + 12, px + 18, py + 26, '#7a5428', 1);
      rrect(g, px + 16, py + 16, 12, 12, 1, '#a8743a', OUT, 1);
      break;
    }
    case 'a': { // anvil / forge
      base();
      rrect(g, px + 6, py + 16, 20, 6, 2, '#3a3a40', OUT, 1); rrect(g, px + 12, py + 22, 8, 8, 1, '#2a2a30', OUT, 1);
      break;
    }
    case 'b': { // brazier — Lastlight's thousand-year fire
      base();
      ellipse(g, px + 16, py + 29, 11, 3, 'rgba(0,0,0,.3)');
      poly(g, [px + 6, py + 16, px + 26, py + 16, px + 21, py + 28, px + 11, py + 28], '#4a4448', OUT, 1.2);
      rrect(g, px + 4, py + 13, 24, 4, 1, '#6a6268', OUT, 1);
      const f = Math.sin(t * 10 + x) * 2;
      g.save(); g.globalAlpha = 0.3 + 0.1 * Math.sin(t * 5); circle(g, px + 16, py + 6, 16, '#ffa040'); g.restore();
      poly(g, [px + 8, py + 14, px + 13 + f, py - 2 - f, px + 16, py + 6, px + 20 - f, py - 6 + f, px + 24, py + 14], '#ff7a2a');
      poly(g, [px + 12, py + 14, px + 16 + f * 0.5, py + 1, px + 20, py + 14], '#ffe08a');
      break;
    }
    case 'g': { // grave / stone
      base(); rrect(g, px + 10, py + 8, 12, 18, 6, '#9a9aa2', OUT, 1); line(g, px + 16, py + 12, px + 16, py + 20, '#6a6a72', 1.5); line(g, px + 13, py + 15, px + 19, py + 15, '#6a6a72', 1.5);
      break;
    }
    default: base();
  }
}

// Buildings drawn as whole structures. b = {x,y,w,h,kind,roof,label}
function drawBuilding(g, b, ox, oy, t, theme) {
  const x = b.x * TS - ox, y = b.y * TS - oy, w = b.w * TS, h = b.h * TS;
  const roofH = Math.floor(b.h * 0.55) * TS;
  const wallY = y + roofH, wallH = h - roofH;
  const stone = theme === 'stone' || theme === 'ash' || b.kind === 'jail' || b.kind === 'chapel';
  const wallC = b.wall || (stone ? '#b8b2a6' : '#f0e2c0');
  // shadow
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x + 6, y + h - 2, w, 6);
  // wall
  rrect(g, x + 2, wallY - 4, w - 4, wallH + 4, 2, wallC, OUT, 1.5);
  if (stone) {
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1;
    for (let r = 0; r < wallH / 10; r++) {
      g.beginPath(); g.moveTo(x + 3, wallY + r * 10); g.lineTo(x + w - 3, wallY + r * 10); g.stroke();
      for (let c = 0; c < w / 16; c++) { const bx = x + c * 16 + (r % 2) * 8; g.beginPath(); g.moveTo(bx, wallY + r * 10); g.lineTo(bx, wallY + r * 10 + 10); g.stroke(); }
    }
  } else {
    g.fillStyle = '#8a5a32';
    g.fillRect(x + 2, wallY - 4, 4, wallH + 4); g.fillRect(x + w - 6, wallY - 4, 4, wallH + 4);
    g.fillRect(x + 2, wallY + wallH / 2 - 2, w - 4, 3);
  }
  // windows
  const doorX = x + (b.doorX - b.x) * TS;
  const nWin = Math.max(1, b.w - 2);
  for (let i = 0; i < b.w; i++) {
    const wx = x + i * TS;
    if (Math.abs(wx - doorX) < 2 || i === 0 && b.w > 3 || i === b.w - 1 && b.w > 3) continue;
    const lit = 0.6 + 0.4 * Math.sin(t * 2 + i + b.x);
    rrect(g, wx + 9, wallY + 6, 14, 12, 2, b.kind === 'jail' ? '#2a2a30' : `rgba(255,220,130,${lit})`, '#5a3a1f', 2);
    if (b.kind === 'jail') { for (let k = 0; k < 3; k++) line(g, wx + 12 + k * 4, wallY + 6, wx + 12 + k * 4, wallY + 18, '#888', 1.5); }
    else { line(g, wx + 16, wallY + 6, wx + 16, wallY + 18, '#5a3a1f', 1.5); line(g, wx + 9, wallY + 12, wx + 23, wallY + 12, '#5a3a1f', 1.5); }
  }
  // door
  const dy = y + h - 26;
  rrect(g, doorX + 8, dy, 16, 26, 7, b.kind === 'jail' ? '#3a3a44' : '#6a3e1e', OUT, 1.5);
  circle(g, doorX + 20, dy + 15, 1.5, '#e8c24a');
  // roof
  const rc = b.roof || '#b5533c';
  if (b.kind === 'chapel') {
    poly(g, [x - 4, wallY, x + w / 2, y - 2, x + w + 4, wallY], rc, OUT, 1.5);
    // steeple
    const sx = x + w / 2;
    rrect(g, sx - 9, y - 26, 18, 30, 1, wallC, OUT, 1.2);
    poly(g, [sx - 12, y - 24, sx, y - 50, sx + 12, y - 24], rc, OUT, 1.5);
    // wave/sun emblem
    circle(g, sx, y - 11, 5, '#e8c24a', OUT, 1);
  } else {
    poly(g, [x - 5, wallY + 2, x + 10, y, x + w - 10, y, x + w + 5, wallY + 2], rc, OUT, 1.5);
    g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 1.2;
    for (let r = 1; r < roofH / 9; r++) {
      const yy = y + r * 9, k = r * 9 / roofH;
      g.beginPath(); g.moveTo(x + 10 - 15 * k, yy); g.lineTo(x + w - 10 + 15 * k, yy); g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(x + 10, y + 2, w - 20, 3);
    if (theme === 'snow') { poly(g, [x - 3, wallY - 2, x + 10, y + 2, x + w - 10, y + 2, x + w + 3, wallY - 2, x + w - 6, wallY - 6, x + w * 0.6, wallY - 3, x + w * 0.3, wallY - 7, x + 6, wallY - 5], 'rgba(255,255,255,.92)'); }

// draw at (x, by) feet, facing right. state: {t, flash, hurt}
function drawMonster(g, def, x, by, st = {}) {
  const t = st.t || 0, s = (def.size || 1) * (st.scale || 1);
  const c = def.c;
  g.save(); g.translate(x, by); g.scale(s, s);
  if (st.alpha !== undefined) g.globalAlpha = st.alpha;
  const shadow = () => ellipse(g, 0, -1, 26, 5, 'rgba(0,0,0,.3)');
  const eyes = (ex, ey, r = 3, col = '#fff', pc = '#1a1020', gap = 8) => {

    circle(g, ex + r * 0.4, ey, r * 0.5, pc); circle(g, ex + gap + r * 0.4, ey, r * 0.5, pc);

  g.restore();

}
// Registries: every monster family (src/monsters/*.js) and battle background (src/backgrounds/*.js)

function drawDeepTile(g, m, x, y, px, py, t) {
  const ch = m.at(x, y), P = DEEP_PAL;

    } else {

  for (let i = 0; i < 2; i++) { const yy = py + 9 + i * 13; g.beginPath(); g.moveTo(px + 2, yy); g.quadraticCurveTo(px + 16, yy - 4, px + 30, yy); g.stroke(); }

      }
      break;
    }
    case 'o': { // boulder
      ellipse(g, px + 16, py + 26, 14, 4, 'rgba(0,0,0,.35)');
      ellipse(g, px + 16, py + 17, 13, 11, P.rockL, OUT, 1.5);
      ellipse(g, px + 12, py + 12, 5, 3, 'rgba(255,255,255,.08)');
      if (hash(x, y, 3) < 0.5) ellipse(g, px + 20, py + 9, 4, 2, '#3a8a5a');
      break;
    }
    case 'c': { // coral
      const col = ['#e87a8a', '#f0a060', '#c070ff', '#5af0d0'][Math.floor(hash(x, y, 4) * 4)];

// ---------- the sea floor on the map screen ----------
function drawDeepMap(g, ox, oy, ow, oh, wsc) {
  const m = getMap('deep'); applyDeepFlags(m);
  const sc = wsc * 2, t = performance.now() / 1000;
  g.fillStyle = 'rgba(2,8,18,.94)'; g.fillRect(0, 0, W, H);
  drawWindow(g, ox - 10, oy - 34, ow + 20, oh + 58);
  text(g, tl('The Sea Floor'), ox, oy - 26, { size: 15, bold: true, color: '#9ad8ff' });
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const c = m.at(x, y);
    g.fillStyle = { '#': '#0a1620', k: '#1e5a3a', o: '#1a2e3c', c: '#7a3a5a', w: '#5a3a24' }[c] || '#1e4a5a';
    g.fillRect(ox + x * sc, oy + y * sc, sc + 0.5, sc + 0.5);
  }
  for (const d of DIVE_SPOTS) { const x = ox + d.x / 2 * sc + sc / 2, y = oy + d.y / 2 * sc + sc / 2; poly(g, [x - 4, y + 3, x + 4, y + 3, x, y - 4], '#ffe9a8', OUT, 1); }
  for (const k in DEEP_LOC) {
    const L = DEEP_LOC[k]; if (k === 'I' && !G.flags.boss_palace) continue;
    const x = ox + L.x * sc + sc / 2, y = oy + L.y * sc + sc / 2;
    circle(g, x, y, 5, L.town ? '#9ad8ff' : k === 'I' ? '#c070ff' : '#5af0d0', OUT, 1.5);
    if (G.flags['visit_' + k] || k === 'H') text(g, L.name, x + 8, y - 7, { size: 11, bold: true });
  }
  if (onSeaFloor() && Math.sin(t * 8) > -0.3) { const p = Field.map.kind === 'deep' ? { x: G.x, y: G.y } : (() => { const q = worldPos(); return { x: q.x / 2, y: q.y / 2 }; })(); circle(g, ox + p.x * sc + sc / 2, oy + p.y * sc + sc / 2, 4, '#ff3a3a', '#fff', 1.5); }
  text(g, tl('Red: you   ▲ bell lines (surface)   Shift: world map   Enter/Esc to close'), W / 2, oy + oh + 5, { size: 11, align: 'center', color: '#b8c4ee' });
}

// The tiles drawn one by one: the way the cache draws them too, and the fallback without it.
function drawTilesDirect(g, m, cx, cy, t) {

    fn(g, m, x, y, x * TS, y * TS, t);

function applyItemEffect(id, m, battle, idx) {

  switch (it.effect) {

  }
  return false;
}

const GEAR_WEIGHTS = { arin: { atk: 1, mag: 0.35 }, lyra: { mag: 1, atk: 0.15 }, oswin: { atk: 0.6, mag: 0.7 }, kestrel: { atk: 1, spd: 0.6 }, selene: { mag: 1, atk: 0.15 } };
function gearScore(m, id) {
  const it = ITEMS[id]; if (!it) return -1;
  const w = GEAR_WEIGHTS[m.id] || { atk: 1 };
  if (it.kind === 'armor') return (it.def || 0) + (it.mag || 0) * (w.mag || 0) * 0.6 + (it.spd || 0) * (w.spd || 0.3);
  return (it.atk || 0) * (w.atk || 0) + (it.mag || 0) * (w.mag || 0) + (it.spd || 0) * (w.spd || 0);
}
function optimiseGear(m) {

  for (const key of ['weapon', 'armor']) {

    if (best && gearScore(m, best) > gearScore(m, m[key])) { if (m[key]) addItem(m[key], 1); m[key] = best; addItem(best, -1); changed++; }
  }

}

async function openShop(listId, keeper) {
  const stock = SHOPS[listId];
  const goldPanel = openPanel(g => { drawWindow(g, 472, 330, 152, 44); text(g, `${G.gold} G`, 610, 342, { size: 17, align: 'right', color: '#ffe9a8' }); });
  await say(keeper, tl('Welcome! What can I do for you?'));
  let mode = 0;
  while (true) {
    const k = await listMenu({ x: 16, y: 16, w: 150, rows: 3, items: [{ label: tl('Buy') }, { label: tl('Sell') }, { label: tl('Leave') }], index: mode });
    if (k < 0 || k === 2) break;
    mode = k;
    if (k === 0) {
      let idx = 0;
      while (true) {
        const det = openPanel(g => drawShopDetail(g, stock[sel.v]));
        const sel = { v: idx };
        const r = await listMenu({
          x: 16, y: 70, w: 300, rows: 9, title: tl('Buy'), index: idx, onChange: i => sel.v = i,
          items: stock.map(id => ({ label: ITEMS[id].name, right: shopPrice(listId, id) + ' G', disabled: G.gold < shopPrice(listId, id) })),
          help: i => ITEMS[stock[i]].desc
        });
        closePanel(det);
        if (r < 0) break;
        idx = r;
        const it = ITEMS[stock[r]];
        G.gold -= shopPrice(listId, stock[r]); addItem(stock[r]); Audio_.sfx('item');
        toast(tl`Bought ${it.name}`);
      }
    } else {
      let idx = 0;
      while (true) {
        const keys = Object.keys(G.inv);
        if (!keys.length) { await say(keeper, tl("You've nothing to sell, friend.")); break; }
        const r = await listMenu({
          x: 16, y: 70, w: 340, rows: 9, title: tl('Sell'), index: Math.min(idx, keys.length - 1),
          items: keys.map(id => ({ label: `${ITEMS[id].name} ×${G.inv[id]}`, right: ITEMS[id].price ? Math.floor(ITEMS[id].price / 2) + ' G' : '—', disabled: !ITEMS[id].price }))
        });
        if (r < 0) break;
        idx = r;
        const id = keys[r];
        G.gold += Math.floor(ITEMS[id].price / 2); addItem(id, -1); Audio_.sfx('item');
      }

  }
  closePanel(goldPanel);
  await say(keeper, tl('Come again! Safe travels.'));
}

async function innStay(townId, price, keeper = tl('Innkeeper')) {
  const fish = hasAnyFish(), opts = fish ? [tl('Stay'), tl('Cook a meal'), tl('Stay until night'), tl('No thanks')] : [tl('Stay'), tl('Stay until night'), tl('No thanks')];
  const c = await choose(keeper, tl`Welcome, travelers! A warm bed is ${price} gold for the party. Will you rest?${fish ? ' Or I can cook up that catch of yours.' : ''}`, opts, opts.length - 1);
  if (opts[c] === tl('Cook a meal')) { if (await cookMenu(keeper)) await say(keeper, tl('Eat up! That\'ll keep you going for a few fights.')); return; }
  const tillNight = opts[c] === tl('Stay until night');
  if (c !== 0 && !tillNight) { await say(keeper, tl('Another time, then.')); return; }
  const hollow = isHollow();   // Hollow mode: the hours pass, but nobody heals
  if (hollow) await say(keeper, tl('In the Hollow? Then a chair by the fire is all I can give you, and it\'s free. The hours will pass. Your wounds won\'t.'));
  else if (G.gold < price) { await say(keeper, tl("Ah... you're a bit short on coin, I'm afraid.")); return; }
  else G.gold -= price;
  await fadeTo(1, 500);
  Audio_.stopMusic();
  Audio_.sfx('inn');
  if (!hollow) healAll();
  G.lastInn = { town: townId };
  sleepUntil(tillNight ? 21 : 7);
  await wait(1600);
  if (Field.map && Field.map.kind === 'town') refreshEntities();
  Field.playMusic();
  Audio_.play(Audio_.curName, true);
  await fadeTo(0, 500);
  await innDream();
  await say(keeper, tillNight ? tl('Good evening! The night folk are out, if that\'s your business.') : hollow ? tl('Morning. You look about as tired as you did last night.') : tl('Good morning! You look well rested.'));
  await promptSave();
}

function fishKinds() { return Object.keys(FISH).filter(id => G.flags['fish_' + id]).length; }
function rollFish(spot) {
  // The Lantern Koi only rises once every Lantern burns again
  if (G.flags.ending && Math.random() < 0.03) return 'koi';
  return weighted(FISH_SPOTS[spot]).f;
}

class FishingUI {
  constructor(fish) {
    this.fish = fish; this.diff = FISH[fish].diff;
    this.state = 'wait'; this.t = 0; this.wait = rnd(1.2, 3.4);
    this.zoneW = [0, 0.3, 0.22, 0.15][this.diff];
    this.need = this.diff + 1; this.hits = 0; this.misses = 0;
    this.pos = 0; this.vel = 0.9; this.zone = rnd(0.15, 0.85 - this.zoneW);
    this.flashT = 0; this.flashCol = null; this.msg = tl('Waiting for a bite...');
  }
  done(result) { UI.close(this, result); }
  update(dt) {
    this.t += dt; this.flashT = Math.max(0, this.flashT - dt);
    if (Input.p('cancel')) { Audio_.sfx('cancel'); return this.done({ ok: false, why: tl('You reel in your line.') }); }
    if (this.state === 'wait') {
      if (Input.p('ok')) { Audio_.sfx('splash'); return this.done({ ok: false, why: tl('Too soon! The fish scattered.') }); }
      if (this.t >= this.wait) { this.state = 'bite'; this.t = 0; this.msg = tl('A bite! Press Enter!'); Audio_.sfx('bite'); }
    } else if (this.state === 'bite') {
      if (Input.p('ok')) { this.state = 'reel'; this.t = 0; this.msg = tl('Reel it in! Press Enter in the green.'); Audio_.sfx('reel'); }
      else if (this.t > 0.9) { Audio_.sfx('splash'); return this.done({ ok: false, why: tl('It got away...') }); }
    } else if (this.state === 'reel') {
      this.pos += this.vel * dt;
      if (this.pos > 1) { this.pos = 2 - this.pos; this.vel = -this.vel; }
      if (this.pos < 0) { this.pos = -this.pos; this.vel = -this.vel; }
      if (Input.p('ok')) {
        if (this.pos >= this.zone && this.pos <= this.zone + this.zoneW) {
          this.hits++; Audio_.sfx('reel'); this.flashT = 0.25; this.flashCol = '#7aff9a';
          if (this.hits >= this.need) { Audio_.sfx('chest'); return this.done({ ok: true }); }
          this.vel = Math.sign(this.vel) * (Math.abs(this.vel) + 0.35);
          this.zone = rnd(0.08, 0.92 - this.zoneW);
        } else {
          this.misses++; Audio_.sfx('buzz'); this.flashT = 0.25; this.flashCol = '#ff7a7a';
          if (this.misses >= 2) { Audio_.sfx('splash'); return this.done({ ok: false, why: tl('The line snapped! It got away.') }); }
        }
      }
    }
  }
  draw(g) {
    const x = 140, y = 110, w = 360, h = 230, t = performance.now() / 1000;
    drawWindow(g, x, y, w, h);
    text(g, tl('Fishing'), x + 16, y + 10, { size: 15, bold: true, color: '#ffe9a8' });
    // water
    const wx = x + 14, wy = y + 36, ww = w - 28, wh = 120;
    const gr = g.createLinearGradient(0, wy, 0, wy + wh); gr.addColorStop(0, '#2c6fc4'); gr.addColorStop(1, '#13406a');
    g.fillStyle = gr; g.fillRect(wx, wy, ww, wh);
    g.strokeStyle = 'rgba(200,230,255,.35)'; g.lineWidth = 1.5;
    for (let r = 0; r < 5; r++) { const yy = wy + 14 + r * 24; g.beginPath(); for (let xx = 0; xx <= ww; xx += 12) g.lineTo(wx + xx, yy + Math.sin(xx * 0.08 + t * 2 + r) * 2); g.stroke(); }
    // bobber
    const bx = wx + ww / 2, dip = this.state === 'bite' ? 8 + Math.sin(t * 30) * 3 : this.state === 'reel' ? 10 : Math.sin(t * 3) * 2;
    const by = wy + 52 + dip;
    line(g, bx, wy - 6, bx, by - 6, 'rgba(255,255,255,.7)', 1);
    if (this.state !== 'wait') { g.save(); g.globalAlpha = 0.6; circle(g, bx, by + 4, 10 + (t * 20) % 12, null, '#d8f4ff', 1.5); g.restore(); }
    circle(g, bx, by, 6, '#fff', OUT, 1.2); g.beginPath(); g.arc(bx, by, 6, 0, Math.PI); g.fillStyle = '#d03a2a'; g.fill();
    if (this.state === 'bite') text(g, '!', bx + 14, by - 30, { size: 28, bold: true, color: '#ffd23a' });
    // reel bar
    const rx = x + 30, ry = y + 172, rw = w - 60;
    g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(rx, ry, rw, 14);
    if (this.state === 'reel') {
      g.fillStyle = '#4ac86a'; g.fillRect(rx + this.zone * rw, ry, this.zoneW * rw, 14);
      const mx = rx + this.pos * rw;
      poly(g, [mx - 6, ry - 8, mx + 6, ry - 8, mx, ry + 2], '#fff', OUT, 1);
      line(g, mx, ry, mx, ry + 14, '#fff', 2);
    }
    g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 1; g.strokeRect(rx + 0.5, ry + 0.5, rw - 1, 13);
    for (let i = 0; i < this.need; i++) circle(g, x + w - 24 - i * 14, y + 18, 4.5, i < this.hits ? '#7aff9a' : 'rgba(255,255,255,.18)', '#fff', 1);
    if (this.flashT > 0) { g.save(); g.globalAlpha = this.flashT * 2; g.fillStyle = this.flashCol; g.fillRect(rx, ry, rw, 14); g.restore(); }
    text(g, this.msg, x + w / 2, y + h - 34, { size: 14, align: 'center' });
    text(g, tl('Esc: stop'), x + w - 14, y + h - 18, { size: 11, align: 'right', color: '#b8c4ee' });
  }
}

const BOARD_STAT_NAME = { hp: tl('Max HP'), mp: tl('Max MP'), str: tl('Attack'), def: tl('Defense'), mag: tl('Magic'), spd: tl('Speed') };
function boardNodeInfo(m, n) {
  const h = BOARD_HERO[m.id];
  if (n === 'spark') return { name: tl('The Spark'), desc: tl('Where every hero\'s light begins. Ignite the nodes next to a lit one.') };
  if (n === 'big') return { name: tl('Great Flame'), desc: `${BOARD_STAT_NAME[h.big]} +20.` };
  const p = nodePassive(m, n);
  if (p) return { name: (n === 'cap' ? '★ ' : '') + PASSIVES[p].name, desc: PASSIVES[p].desc, passive: true };
  const [s, v] = BOARD_STATS[n];
  const names = { hp: tl('Vigor'), mp: tl('Focus'), atk: tl('Might'), mag: tl('Insight'), def: tl('Ward'), spd: tl('Swiftness') };
  return { name: names[n], desc: `${BOARD_STAT_NAME[s]} +${v < 1 ? Math.round(v * 100) + '%' : v}.` };
}
const BOARD_POS = (n) => ({ x: 110 + BOARD_NODES[n].x * 70, y: 100 + BOARD_NODES[n].y * 58 });
async function lanternBoard(mi) {
  let idx = mi;
  const ids = Object.keys(BOARD_NODES);
  let cur = 'spark';
  const ui = {
    update() {
      const m = G.party[idx];
      if (Input.p('cancel')) { Audio_.sfx('cancel'); UI.close(this); return; }
      // the run key (Shift) flips to the next hero
      if (Input.p('run') && G.party.length > 1) { idx = (idx + 1) % G.party.length; Audio_.sfx('cursor'); }
      const dirs = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };
      for (const d in dirs) if (Input.p(d)) {
        const [dx, dy] = dirs[d], a = BOARD_NODES[cur];
        let best = null, bd = 1e9;
        for (const n of ids) {
          if (n === cur) continue;
          const b = BOARD_NODES[n], vx = b.x - a.x, vy = b.y - a.y;
          const along = vx * dx + vy * dy; if (along <= 0) continue;
          const dist = along + Math.abs(vx * dy - vy * dx) * 2;
          if (dist < bd) { bd = dist; best = n; }
        }
        if (best) { cur = best; Audio_.sfx('cursor'); }
      }
      if (Input.p('ok')) {
        if (boardBuy(m, cur)) Audio_.sfx('lantern');
        else Audio_.sfx('buzz');
      }

    draw(g) {
      const m = G.party[idx];
      drawWindow(g, 20, 16, 600, 448);

      text(g, tl`Embers: ${m.embers || 0}`, 600, 34, { size: 16, align: 'right', color: '#ffd27a' });

      else if (m.level >= MAX_LEVEL) text(g, tl`Next Ember: ${EMBER_CAP_XP - (m.capxp || 0)} EXP`, 600, 56, { size: 12, align: 'right', color: '#b8c4ee' });
      for (const n of ids) for (const l of BOARD_NODES[n].links) if (n < l) {
        const a = BOARD_POS(n), b = BOARD_POS(l), lit = boardOwned(m, n) && boardOwned(m, l);
        line(g, a.x, a.y, b.x, b.y, lit ? '#ffd27a' : 'rgba(200,210,255,.25)', lit ? 3 : 2);
      }
      for (const n of ids) {
        const p = BOARD_POS(n), own = boardOwned(m, n), can = boardCanBuy(m, n), info = boardNodeInfo(m, n);
        const r = n === 'cap' ? 17 : info.passive || n === 'big' ? 14 : 11;
        if (own) { g.save(); g.globalAlpha = 0.35 + Math.sin(performance.now() / 300) * 0.1; circle(g, p.x, p.y, r + 8, '#ffb84a'); g.restore(); }
        circle(g, p.x, p.y, r, own ? '#ffd27a' : can ? '#4a4a78' : '#24243a', can ? '#ffe9a8' : '#8890c0', can ? 2.5 : 1.5);
        if (!own) text(g, String(BOARD_NODES[n].cost), p.x, p.y - 7, { size: 12, bold: true, align: 'center', color: can ? '#fff' : '#8890c0' });
        if (n === cur) circle(g, p.x, p.y, r + 5, null, '#fff', 2);
      }
      const info = boardNodeInfo(m, cur), N = BOARD_NODES[cur];
      drawWindow(g, 40, 372, 560, 80);
      text(g, info.name, 56, 382, { size: 17, bold: true, color: info.passive ? '#9ad8ff' : '#ffe9a8' });
      text(g, boardOwned(m, cur) ? tl('Lit') : tl`${N.cost} Ember${N.cost > 1 ? 's' : ''}`, 584, 384, { size: 14, align: 'right', color: boardOwned(m, cur) ? '#7aff9a' : boardCanBuy(m, cur) ? '#ffd27a' : '#8890c0' });
      text(g, info.desc, 56, 406, { size: 14 });
      text(g, tl`Enter: ignite   ${G.party.length > 1 ? 'Shift: next hero   ' : ''}Esc: back`, 56, 428, { size: 12, color: '#b8c4ee' });
    }
  };
  await UI.push(ui);
}

//  The diving bell and the sea floor, Nerith and the Drowned Palace,
//  the Hadal Rift, treasure maps, lanternmoths and the Undermarket.

const DEEP_TOWNS = ['nerith', 'undermarket'];
function listJoin(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }

// Where the party is, in world coordinates (for the map screen)
function worldPos() {
  const m = Field.map;
  if (!m || m.kind === 'world') return { x: G.x, y: G.y };
  if (m.kind === 'deep') return { x: G.x * 2, y: G.y * 2 };
  let ch = null;
  if (m.kind === 'town') ch = m.loc;
  else if (m.kind === 'interior') ch = TOWN_DEFS[m.town].loc;
  else if (m.kind === 'dungeon') ch = DUNGEONS[m.dungeon].loc;
  const L = ch && locDef(ch);
  if (!L) return { x: G.x, y: G.y };
  return locMap(ch) === 'deep' ? { x: L.x * 2, y: L.y * 2 } : { x: L.x, y: L.y };
}
function onSeaFloor() {
  const m = Field.map;
  if (!m) return false;
  if (m.kind === 'deep') return true;
  const ch = m.kind === 'town' ? m.loc : m.kind === 'interior' ? TOWN_DEFS[m.town].loc : m.kind === 'dungeon' ? DUNGEONS[m.dungeon].loc : null;
  return !!ch && locMap(ch) === 'deep' && m.id !== 'undermarket' && m.town !== 'undermarket';
}

function digSpotAt(x, y) {
  const m = Field.map;
  if (!m || !m.digs) return null;
  for (const k in m.digs) { const d = m.digs[k]; if (d && d.x === x && d.y === y && hasItem('tmap' + k) && !G.flags['dug_' + k]) return +k; }
  return null;
}
function mapsDug() { return [1, 2, 3, 4, 5].filter(k => G.flags['dug_' + k]).length; }
function mapsFound() { return [1, 2, 3, 4, 5].filter(k => G.flags['dug_' + k] || hasItem('tmap' + k)).length; }
// a battle against map-carrying monsters may drop the next missing map (2, 3 or 4), once per battle
function treasureMapDrop(enemies) {
  if (!enemies.some(e => e.def.tmap) || Math.random() >= 0.2) return null;
  const k = [2, 3, 4].find(n => !hasItem('tmap' + n) && !G.flags['dug_' + n]);
  return k ? 'tmap' + k : null;
}
async function digTreasure(k) {
  await narrate(tl('This is the spot from the map. The party starts digging...'));
  for (let i = 0; i < 3; i++) { Audio_.sfx('bump'); await wait(320); }
  Audio_.sfx('chest');
  G.flags['dug_' + k] = true; addItem('tmap' + k, -1);
  const got = [];
  for (const l of TREASURES[k].loot) {
    if (l.startsWith('gold:')) { const n = parseInt(l.slice(5)); G.gold += n; got.push(n + ' gold'); }
    else { addItem(l); got.push(ITEMS[l].name); }

  await narrate(tl`Buried treasure! Found ${listJoin(got)}.`);

'use strict';
// ============================================================
//  PLATFORM (1.8): install as an app, moving saves between devices,
//  trophies, the speedrun timer and splits, and the battery saver.
//  Loaded after deep.js and before story.js. The trophy and split checks
//  run from the main loop (platformTick), never at load time.

// ---------------- install (PWA) ----------------
// build.py writes manifest.webmanifest, sw.js and icons/ beside index.html. The service worker only
// registers when the game is served over http(s); opened as a file, the game simply runs as before.
const PWA = { prompt: null };
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !MODS.length) {   // a modded build isn't the installable game
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.prompt = e; });
window.addEventListener('appinstalled', () => { PWA.prompt = null; toast(tl('Lanternfall is installed')); });
function isInstalled() {
  try { return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true || !!window.__TAURI__; } catch (e) { return false; }
}
async function installApp() {
  if (PWA.prompt) {
    PWA.prompt.prompt();
    const r = await PWA.prompt.userChoice.catch(() => null);
    PWA.prompt = null;
    if (r && r.outcome === 'accepted') return;
  }
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const framed = window.top !== window.self;
  await sayAll([
    [tl('Install'), framed ? tl('Inside the itch.io page the game can\'t install itself. Open it at its own address (see the itch.io page or the README), or download the desktop version.')
      : ios ? tl('On iPhone or iPad: tap Share, then "Add to Home Screen".') : tl('In Chrome or Edge, use the install icon at the right of the address bar, or the browser menu: "Install Lanternfall".')],
    [tl('Install'), tl('Once installed, the game opens in its own window and plays offline. Saves stay on this device: use Transfer saves on the title screen to move them.')]
  ]);
}

// ---------------- moving saves between devices ----------------
const SAVE_KEYS = () => [...ALL_SLOTS.map(s => SAVE_PREFIX + s), CFG_KEY, TROPHY_KEY, SPLIT_KEY];
function exportSaves() {
  const data = { game: 'lanternfall', exported: new Date().toISOString(), keys: {} };
  for (const k of SAVE_KEYS()) { const v = localStorage.getItem(k); if (v !== null) data.keys[k] = v; }
  return JSON.stringify(data);
}
function importSaves(text) {
  const data = JSON.parse(text);
  if (!data || data.game !== 'lanternfall' || !data.keys) throw new Error(tl('Not a Lanternfall save file'));
  const allowed = new Set(SAVE_KEYS());
  let n = 0;
  for (const [k, v] of Object.entries(data.keys)) if (allowed.has(k) && typeof v === 'string') { localStorage.setItem(k, v); n++; }
  loadCfg(); applyKeymap(); Trophies.load();
  return n;
}
function pickFile() {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => { const f = inp.files && inp.files[0]; if (!f) return res(null); const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => res(null); r.readAsText(f); };
    window.addEventListener('focus', () => setTimeout(() => { if (!inp.files || !inp.files.length) res(null); }, 800), { once: true });
    inp.click();
  });
}
async function transferMenu() {
  const k = await listMenu({ x: W / 2 - 130, y: 170, w: 260, rows: 3, title: tl('Transfer saves'), items: [{ label: tl('Export to a file') }, { label: tl('Import from a file') }, { label: tl('Back') }],
    help: i => [tl('Download every save slot, your settings and trophies as one file.'), tl('Load a file exported from another browser or device. Slots in the file replace the ones here.'), ''][i], helpY: H - 60 });
  if (k === 0) {
    const blob = new Blob([exportSaves()], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `lanternfall-saves-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    await narrate(tl('Your saves were downloaded as a file. Import it on another device from this same menu.'));
  } else if (k === 1) {
    const text = await pickFile();
    if (!text) return;
    try { const n = importSaves(text); Audio_.sfx('chest'); await narrate(tl`Imported ${n} entries. Your saves are ready to load.`); }
    catch (e) { Audio_.sfx('buzz'); await narrate(tl('That file isn\'t a Lanternfall save export.')); }
  }
}

const SPLIT_KEY = 'lanternfall_splits_v1';
const SPLITS = [['lantern1', tl('Ember Lantern')], ['lantern2', tl('Tide Lantern')], ['lantern3', tl('Stone Lantern')], ['ending', tl('Dawn Lantern')]];

function bestSplits() { try { return JSON.parse(localStorage.getItem(SPLIT_KEY) || '{}') || {}; } catch (e) { return {}; } }
function fmtClock(s) {
  s = Math.max(0, s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = Math.floor(s % 60), ds = Math.floor(s * 10) % 10;
  return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${ds}`;
}
function checkSplits() {
  if (!G.splits) G.splits = {};
  for (const [flag, name] of SPLITS) {
    if (!G.flags[flag] || G.splits[flag] !== undefined) continue;
    G.splits[flag] = G.playTime;
    if (G.flags.ngplus) continue;   // New Game+ runs aren't comparable
    const best = bestSplits(), delta = best[flag] ? G.playTime - best[flag] : null;
    splitFlash = { name, time: G.playTime, delta, t: 5 };
    const complete = SPLITS.every(([f]) => typeof G.splits[f] === 'number');
    if (flag === 'ending' && complete && (!best.ending || G.playTime < best.ending)) {
      try { localStorage.setItem(SPLIT_KEY, JSON.stringify({ ...G.splits })); } catch (e) { }
      if (CFG.speedrun) toast(tl('New best time!'));
    }
  }
}
function drawSpeedrun(g, dt) {

//  LIVING WORLD (1.9): the clock, day and night, regional weather

// ---------------- the clock ----------------
// One real second on the field is one minute of game time: a day lasts 24 minutes.
const DAY_MIN = 1440, CLOCK_START = 8 * 60;
function clockNow() { return G.clock === undefined ? CLOCK_START : G.clock; }
function timeOfDay() { return ((clockNow() % DAY_MIN) + DAY_MIN) % DAY_MIN; }
function dayNumber() { return Math.floor(clockNow() / DAY_MIN) + 1; }
// night runs from 20:30 to 5:30; dusk and dawn are the hour either side
function isNight() { const t = timeOfDay(); return t >= 20.5 * 60 || t < 5.5 * 60; }
function dayPhase() {
  const t = timeOfDay();
  if (t < 5.5 * 60 || t >= 20.5 * 60) return 'night';
  if (t < 7 * 60) return 'dawn';
  if (t < 19 * 60) return 'day';
  return 'dusk';
}
function fmtClockHM() { const t = Math.floor(timeOfDay()); return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; }
let lastNight = null;
function advanceClock(dt) {
  G.clock = clockNow() + dt;
  const n = isNight();
  if (lastNight !== null && n !== lastNight && Field.map && Field.map.kind === 'town' && !Script.running) refreshEntities();   // night folk come out, day folk go home
  lastNight = n;
}
// jump the clock forward to the next given hour (resting at an inn, a tent)
function sleepUntil(hour) {
  const t = timeOfDay(); let add = hour * 60 - t; if (add <= 30) add += DAY_MIN;
  G.clock = clockNow() + add; lastNight = isNight();
}
// how dark the sky is, 0 (noon) to 1 (midnight), with a warm tint at dawn and dusk
function skyTint() {
  const t = timeOfDay() / 60;

  const warm = t >= 5 && t < 7.5 ? 1 - Math.abs(t - 6.2) / 1.3 : t >= 17.5 && t < 21 ? 1 - Math.abs(t - 19.3) / 1.7 : 0;

}
// where the sky can be seen: the world map and outdoor towns
function underSky(m) { return m && (m.kind === 'world' || (m.kind === 'town' && !m.underwater && !m.underground)); }

// ---------------- weather ----------------
// Each region rolls its weather every six game hours from the clock, so it needs no saving.
const WEATHER = {
  clear: { name: tl('Clear'), icon: '☀' },
  rain: { name: tl('Rain'), icon: '☂', battle: tl('Rain: water and lightning hit 25% harder, fire 25% softer.'), boost: ['water', 'bolt'], dampen: ['fire'] },
  snow: { name: tl('Snow'), icon: '❄', battle: tl('Snow: ice hits 25% harder, fire 25% softer.'), boost: ['ice'], dampen: ['fire'] },
  sand: { name: tl('Sandstorm'), icon: '≋', battle: tl('Sandstorm: every physical attack misses 15% more often.'), miss: 0.15 },
  fog: { name: tl('Fog'), icon: '☁', battle: tl('Fog: physical attacks miss 10% more often.'), miss: 0.1 },
  ash: { name: tl('Ashfall'), icon: '✶', battle: tl('Ashfall: fire hits 25% harder, water 25% softer.'), boost: ['fire'], dampen: ['water'] }

function regionWeather(reg, y) {
  const block = Math.floor(clockNow() / 360), h = hash(block, (reg || 'S').charCodeAt(0), 77);
  if (reg === 'H') return 'ash';
  if (reg === 'B' && y <= 11) return h < 0.55 ? 'snow' : 'clear';
  if (reg === 'B') return h < 0.2 ? 'rain' : 'clear';
  if (reg === 'F') return h < 0.3 ? 'sand' : 'clear';
  if (reg === 'G') return 'clear';                       // the sky valley sits above the weather
  if (reg === 'C') return h < 0.5 ? 'fog' : 'clear';
  if (reg === 'A' || reg === 'E') return h < 0.25 ? 'rain' : h < 0.35 ? 'fog' : 'clear';

}

  const w = getMap('world'), reg = w.region[y] && w.region[y][x];
  return regionWeather(reg, y);
}
// the weather where the party is now (indoors and underground there is none)
function currentWeather() {
  const m = Field.map;
  if (!m) return 'clear';
  if (m.kind === 'world') return G.inAir ? 'clear' : worldWeatherAt(G.x, G.y);
  if (m.kind === 'town' && !m.underwater && !m.underground) { const L = locDef(m.loc); return L && locMap(m.loc) === 'world' ? worldWeatherAt(L.x, L.y) : 'clear'; }

}

// ---------------- drawing ----------------
function drawSky(g, m, cx, cy, t) {

'use strict';
// ============================================================
//  THE SUNSET OPAL (1.9): a stealth heist in the Mirage palace at night.
//  Guards walk fixed patrols and see 4 squares ahead, widening to a 3-square
//  cone; walls and pillars block their sight. Get seen and you're thrown out.
// ============================================================

// # wall, o pillar (blocks sight), . floor, E the cellar grate (exit), V the vault
const HEIST_MAP = [
  '####################',
  '#E.....#....#......#',
  '#......#.o..#..o...#',
  '#..o...#....#......#',
  '#......###.###..o..#',
  '#..................#',
  '###.####....####.###',
  '#......#....#......#',
  '#.o....#.o..#....o.#',
  '#......#....#......#',
  '#......##..##......#',
  '#..o...........V...#',
  '#..................#',
  '####################'
];
// patrols: waypoints walked in order (and looped); a guard takes one step every GUARD_STEP seconds
const GUARD_STEP = 0.6;
const HEIST_GUARDS = [
  [[3, 5], [16, 5]],                       // the long hall, back and forth
  [[9, 7], [9, 9], [10, 9], [10, 7]],      // the middle room
  [[14, 1], [18, 1], [18, 3], [14, 3]],    // the east room
  [[11, 12], [18, 12]]                     // in front of the vault
];
const HEIST_SOLID = new Set(['#', 'o']);
function buildHeist() {
  const tiles = HEIST_MAP.map(r => r.split(''));
  return new GameMap({ id: 'heist', kind: 'heist', w: tiles[0].length, h: tiles.length, tiles, theme: 'tomb', name: tl('The Palace Vaults'), torches: new Set(['4,0', '15,0', '2,6', '17,6', '5,13', '14,13']) });
}
// expand a patrol into the square it stands on at each step
function patrolPath(wp) {
  const out = [];
  const legs = wp.length === 2 ? [wp[0], wp[1], wp[0]] : [...wp, wp[0]];
  for (let k = 0; k < legs.length - 1; k++) {
    let [x, y] = legs[k]; const [x1, y1] = legs[k + 1];
    while (x !== x1 || y !== y1) { out.push([x, y]); x += Math.sign(x1 - x); y += Math.sign(y1 - y); }
  }
  return out;
}
function guardAt(path, step) {
  const n = path.length, i = ((step % n) + n) % n, [x, y] = path[i], [nx, ny] = path[(i + 1) % n];
  const dir = nx > x ? 'right' : nx < x ? 'left' : ny > y ? 'down' : 'up';
  return { x, y, dir };
}
// the squares a guard can see: 4 ahead, the cone widening to 3 wide from the 2nd square; solid squares stop sight
function guardSight(map, g) {
  const [dx, dy] = DIRS[g.dir], px = -dy, py = dx, seen = [];
  const open = (x, y) => map.at(x, y) !== undefined && !HEIST_SOLID.has(map.at(x, y));
  for (let d = 1; d <= 4; d++) {
    const cx = g.x + dx * d, cy = g.y + dy * d;
    if (!open(cx, cy)) break;
    seen.push([cx, cy]);
    if (d >= 2) for (const s of [-1, 1]) {
      const sx = cx + px * s, sy = cy + py * s, bx = sx - dx, by = sy - dy;
      if (open(sx, sy) && open(bx, by)) seen.push([sx, sy]);
    }
  }
  return seen;
}
function heistEntities(m) {
  const out = [];
  const paths = HEIST_GUARDS.map(patrolPath);
  paths.forEach((p, i) => { const g = guardAt(p, 0); out.push({ kind: 'guard', x: g.x, y: g.y, dir: g.dir, path: p, step: 0, look: { ...LOOKS.guard, skin: '#c98e62', hat: 'cap', accent: '#e8c24a' }, idx: i }); });
  if (!hasItem('sunset_opal') && !G.flags.heist_done) out.push({ kind: 'chest', x: 15, y: 11, key: 'heist_opal', loot: 'sunset_opal', opened: false, opal: true });
  return out;
}
const Heist = {
  t: 0,
  seen(m) { const s = new Set(); for (const e of m.entities) if (e.kind === 'guard') for (const [x, y] of guardSight(m, e)) s.add(x + ',' + y); return s; },
  tick(m, dt) {
    if (Script.running || UI.stack.length) return;
    this.t += dt;
    if (this.t >= GUARD_STEP) {
      this.t -= GUARD_STEP;
      for (const e of m.entities) if (e.kind === 'guard') {
        const g = guardAt(e.path, e.step + 1);
        if (g.x === G.x && g.y === G.y) continue;      // never walk into the player: the guard waits
        e.step++; Object.assign(e, g);
      }
    }
    this.check(m);
  },
  check(m) {
    if (Script.running || Field.anim) return;

};

}

    kinds.forEach((id, i) => {

'use strict';
// ============================================================
//  TOWN EDITOR (2.0, EN-3). Open index.html?edit
//  Draws the town with the game's own art and people, lets you move buildings and paint
//  paths, water, piers, decorations and exits, checks the layout as you go, lets you walk
//  around in it, and exports it as a mod (or as an entry for content/towns.json).
//  townProblems() is also what the build runs (tools/load_check.js) on every town.
// ============================================================
const EDIT_MODE = /[?&]edit\b/.test(location.search);
const TOWN_DECOR = { t: 'Tree', P: 'Pine', m: 'Cliff', r: 'Rock', f: 'Flowers', F: 'Fence', w: 'Well', l: 'Lamp post', c: 'Crates', a: 'Anvil', b: 'Brazier', g: 'Gravestone' };
// the states a town is checked in: people come and go with the story and the time of day
const POSTGAME_FLAGS = ['q1', 'lantern1', 'lantern2', 'lantern3', 'lantern4', 'bridge', 'ship', 'airship', 'ending', 'isle', 'chapter6', 'q_drowned', 'cards_done', 'heist_done'];
const TOWN_STATES = [['by day, early in the story', false, false], ['at night, early in the story', true, false], ['by day, after the ending', false, true], ['at night, after the ending', true, true]];

// Everything wrong with a town's layout: a list of { msg, x, y }. def defaults to the town's own.
function townProblems(id, def = TOWN_DEFS[id]) {
  const P = [], add = (msg, x, y) => { if (!P.some(p => p.msg === msg)) P.push({ msg, x, y }); };
  const { w, h } = def, inside = (x, y) => x >= 0 && y >= 0 && x < w && y < h, edge = (x, y) => x === 0 || y === 0 || x === w - 1 || y === h - 1;
  const bAt = (x, y) => def.buildings.find(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h);
  def.buildings.forEach((b, i) => {
    if (b.x < 1 || b.y < 1 || b.x + b.w > w - 1 || b.y + b.h > h - 1) add(`"${b.id}" runs into the town's edge`, b.x, b.y);
    for (const o of def.buildings.slice(i + 1)) if (b.x < o.x + o.w && o.x < b.x + b.w && b.y < o.y + o.h && o.y < b.y + b.h) add(`"${b.id}" and "${o.id}" overlap`, o.x, o.y);
    if (def.buildings.findIndex(o => o.id === b.id) !== i) add(`two buildings are called "${b.id}"`, b.x, b.y);
  });
  for (const [x0, y0, x1, y1] of def.paths || []) if (!inside(x0, y0) || !inside(x1, y1)) add('a path runs off the town', x0, y0);
  for (const [k, list] of [['water', def.water], ['a pier', def.piers]]) for (const [x, y, rw, rh] of list || []) if (!inside(x, y) || !inside(x + rw - 1, y + rh - 1)) add(`${k === 'water' ? 'water' : k} runs off the town`, x, y);
  for (const [x, y, c] of def.decor || []) { const what = `a decoration (${(TOWN_DECOR[c] || c).toLowerCase()})`; if (!inside(x, y)) add(`${what} is off the town`, x, y); else if (bAt(x, y)) add(`${what} is hidden under "${bAt(x, y).id}"`, x, y); }
  for (const [x, y] of def.exits) if (!inside(x, y) || !edge(x, y)) add('an exit has to be on the edge', x, y);
  if (P.some(p => / off the town|edge|runs into/.test(p.msg))) return P;   // can't lay it out
  // walk it, with the game's own rules, from the way in
  const m = buildTown(id, def), keepMap = Field.map, keepFlags = G.flags, keepClock = G.clock;
  Field.map = m;
  try {
    const ok = (x, y) => Field.walkable(x, y), seen = new Set(), q = [];
    for (const [x, y] of def.exits) if (inside(x, y) && ok(x, y)) { seen.add(x + ',' + y); q.push([x, y]); }
    if (!q.length) add('no exit can be walked onto', def.exits[0][0], def.exits[0][1]);
    while (q.length) {
      const [x, y] = q.shift();
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const k = (x + dx) + ',' + (y + dy); if (!seen.has(k) && ok(x + dx, y + dy)) { seen.add(k); q.push([x + dx, y + dy]); } }
    }
    for (const b of def.buildings) {
      const dx = b.x + Math.floor(b.w / 2), dy = b.y + b.h;
      if (!seen.has(dx + ',' + dy)) add(`the door of "${b.id}" can't be reached from the way in`, dx, dy);
    }
    // the people, in each state of the story and the day (the game's own populate())
    const bad = new Map();   // one line per person and problem, saying when if it isn't always
    for (const [when, night, post] of TOWN_STATES) {
      G.flags = post ? Object.fromEntries(POSTGAME_FLAGS.map(f => [f, true])) : {};
      G.clock = night ? 23 * 60 : 10 * 60;
      populate(m);
      for (const n of m.entities) {
        if (n.kind !== 'npc') continue;
        const who = n.name || (n.talk && n.talk.name ? n.talk.name.replace(/^talk/, '') : 'someone');
        const what = !ok(n.x, n.y) ? 'stands where nobody can walk' : !seen.has(n.x + ',' + n.y) ? "can't be reached" : null;
        if (!what) continue;
        const k = `${who}|${what}|${n.x},${n.y}`;
        if (!bad.has(k)) bad.set(k, { who, what, x: n.x, y: n.y, when: [] });
        bad.get(k).when.push(when);
      }
    }
    for (const b of bad.values()) add(`${b.who} ${b.what}${b.when.length < TOWN_STATES.length ? ' (' + b.when.join('; ') + ')' : ''}`, b.x, b.y);
  } catch (e) { add('the town fails to build: ' + e.message, 0, 0); }
  finally { Field.map = keepMap; G.flags = keepFlags; G.clock = keepClock; }
  return P;
}
// Every town's problems, as lines; the build fails on any (tools/load_check.js).
function townReport() {
  const out = [];
  for (const id of Object.keys(TOWN_DEFS)) for (const p of townProblems(id)) out.push(`towns.json: ${id}: ${p.msg} (at ${p.x}, ${p.y})`);
  return out;
}

// ---------- the editor ----------
const EDITOR_STORE = 'lanternfall_editor_v1';
const Editor = {
  id: null, def: null, map: null, tool: 'select', decor: 't', sel: null, drag: null, hover: null,
  undoStack: [], redoStack: [], cam: { x: 0, y: 0 }, night: false, post: false, problems: [], walking: false, panel: null,
  start() {
    G.party = [makeMember('arin', 10)]; G.flags = {}; G.clock = 10 * 60;
    SIDE_PANEL = 340; document.body.style.justifyContent = 'flex-start'; resize();
    this.buildPanel();
    this.listen();
    Fade.v = 0;
    let drafts = {}; try { drafts = JSON.parse(localStorage.getItem(EDITOR_STORE) || '{}'); } catch (e) { }
    this.drafts = drafts;
    this.open(Object.keys(TOWN_DEFS)[0]);
  },
  // the game's own layouts, before any edit, to reset to and to tell what changed
  originals: null,
  original(id) { if (!this.originals) this.originals = JSON.parse(JSON.stringify(TOWN_DEFS)); return this.originals[id]; },
  open(id) {
    this.original(id);
    this.id = id; this.sel = null; this.undoStack = []; this.redoStack = [];
    this.def = JSON.parse(JSON.stringify(this.drafts[id] || this.original(id)));
    this.cam = { x: 0, y: 0 };
    this.rebuild(); this.centre(this.def.w / 2, this.def.h / 2);
    G.scene = EditorScene;
    this.refreshPanel();
  },
  // after every change: the map, the people, the checks, the draft
  rebuild() {
    TOWN_DEFS[this.id] = this.def; delete G.maps[this.id];
    this.map = buildTown(this.id, this.def);
    this.problems = townProblems(this.id, this.def);
    G.flags = this.post ? Object.fromEntries(POSTGAME_FLAGS.map(f => [f, true])) : {};
    G.clock = this.night ? 23 * 60 : 10 * 60;
    try { populate(this.map); } catch (e) { this.map.entities = []; }
    const same = JSON.stringify(this.def) === JSON.stringify(this.original(this.id));
    if (same) delete this.drafts[this.id]; else this.drafts[this.id] = this.def;
    try { localStorage.setItem(EDITOR_STORE, JSON.stringify(this.drafts)); } catch (e) { }
  },
  change(fn) {   // every edit goes through here, so it can be undone
    this.undoStack.push(JSON.stringify(this.def)); if (this.undoStack.length > 200) this.undoStack.shift();
    this.redoStack = [];
    fn(this.def); this.rebuild(); this.refreshPanel();
  },
  undo() { if (!this.undoStack.length) return; this.redoStack.push(JSON.stringify(this.def)); this.def = JSON.parse(this.undoStack.pop()); this.sel = null; this.rebuild(); this.refreshPanel(); },
  redo() { if (!this.redoStack.length) return; this.undoStack.push(JSON.stringify(this.def)); this.def = JSON.parse(this.redoStack.pop()); this.sel = null; this.rebuild(); this.refreshPanel(); },
  centre(tx, ty) { this.cam.x = tx * TS - W / 2; this.cam.y = ty * TS - H / 2; this.clampCam(); },
  clampCam() {
    const mw = this.def.w * TS, mh = this.def.h * TS;
    this.cam.x = mw <= W ? (mw - W) / 2 : clamp(this.cam.x, -TS, mw - W + TS);
    this.cam.y = mh <= H ? (mh - H) / 2 : clamp(this.cam.y, -TS, mh - H + TS);
  },

  // ---- what's under a tile ----
  buildingAt(x, y) { return this.def.buildings.findIndex(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h); },
  decorAt(x, y) { return (this.def.decor || []).findIndex(d => d[0] === x && d[1] === y); },
  exitAt(x, y) { return this.def.exits.findIndex(e => e[0] === x && e[1] === y); },
  rectIn(list, x, y, corners) {
    return (list || []).findIndex(r => corners ? x >= Math.min(r[0], r[2]) && x <= Math.max(r[0], r[2]) && y >= Math.min(r[1], r[3]) && y <= Math.max(r[1], r[3]) : x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3]);
  },

  // ---- mouse ----
  tileOf(e) {

    return { x: Math.floor((gx + this.cam.x) / TS), y: Math.floor((gy + this.cam.y) / TS), gx, gy };
  },
  down(e) {
    if (this.walking) return;

    if (e.button === 2 || e.button === 1) { this.drag = { pan: true, gx: p.gx, gy: p.gy, cx: this.cam.x, cy: this.cam.y }; return; }
    if (this.tool === 'select') {

      this.sel = di >= 0 ? { type: 'decor', i: di } : ei >= 0 ? { type: 'exit', i: ei } : bi >= 0 ? { type: 'building', i: bi } : null;
      if (this.sel) this.drag = { move: true, x: p.x, y: p.y, before: JSON.stringify(d) };

    }
    if (this.tool === 'decor') { this.drag = { paint: true, before: JSON.stringify(d) }; this.paint(p); return; }
    if (this.tool === 'exit') {
      if (p.x !== 0 && p.y !== 0 && p.x !== d.w - 1 && p.y !== d.h - 1) return;

  },
  move(e) {

    if (dr.pan) { this.cam.x = dr.cx - (p.gx - dr.gx); this.cam.y = dr.cy - (p.gy - dr.gy); this.clampCam(); return; }
    if (dr.rect) { dr.x1 = p.x; dr.y1 = p.y; return; }

      const dx = p.x - dr.x, dy = p.y - dr.y, s = this.sel, d = this.def;
      if (s.type === 'building') { d.buildings[s.i].x += dx; d.buildings[s.i].y += dy; }
      if (s.type === 'decor') { d.decor[s.i][0] += dx; d.decor[s.i][1] += dy; }
      if (s.type === 'exit') { d.exits[s.i][0] += dx; d.exits[s.i][1] += dy; }

  up() {

    if (!dr.rect) return;

    if (this.tool === 'water') this.change(d => (d.water = d.water || []).push([x, y, w, h]));

  paint(p) {

  // erase the top thing on a tile: a decoration, a pier, a path, water, an exit, then a building
  erase(x, y) {

  // ---- keys ----

  // ---- walking around in it ----

  },
  stopWalking() {

  },

  // ---- export ----

  entryJson() { return `"${this.id}": ` + JSON.stringify(this.def, null, 2); },
  download(name, text) {

<div class="row"><button data-act="undo"${this.undoStack.length ? '' : ' disabled'}>Undo</button><button data-act="redo"${this.redoStack.length ? '' : ' disabled'}>Redo</button><button data-act="walk">Walk around</button>${changed ? '<button data-act="reset">Reset to the game\'s</button>' : ''}</div>

  onInput(e) {
    const t = e.target, d = this.def;
    if (t.dataset.act === 'town' && e.type === 'change') { this.open(t.value); return; }
    const num = v => Math.max(0, parseInt(v, 10) || 0);
    if (t.dataset.b && e.type === 'change') {
      const i = this.sel.i, k = t.dataset.b;
      this.change(d => {
        const b = d.buildings[i];
        if (k === 'chimney') { if (t.checked) b.chimney = true; else delete b.chimney; }
        else if (k === 'sign') { if (t.value) b.sign = t.value; else delete b.sign; }
        else if (k === 'w' || k === 'h' || k === 'price') b[k] = num(t.value);
        else b[k] = t.value;
        if (b.kind === 'shop' && !b.shop) b.shop = Object.keys(SHOPS)[0];
        if (b.kind !== 'shop') delete b.shop;
        if (b.kind === 'inn' && b.price === undefined) b.price = 50;
        if (b.kind !== 'inn') delete b.price;
      });
    }
    if (t.dataset.t && e.type === 'change') { const k = t.dataset.t; this.change(d => { d[k] = k === 'w' || k === 'h' ? clamp(num(t.value), 10, 40) : t.value; }); this.clampCam(); }
  },
  onClick(e) {
    const t = e.target.closest('button,[data-prob]'); if (!t) return;
    if (t.dataset.tool) { this.tool = t.dataset.tool; this.refreshPanel(); return; }
    if (t.dataset.decor) { this.decor = t.dataset.decor; this.refreshPanel(); return; }
    if (t.dataset.prob !== undefined) { const p = this.problems[+t.dataset.prob]; this.centre(p.x + 0.5, p.y + 0.5); this.flash = { x: p.x, y: p.y, t: 1.5 }; return; }
    const a = t.dataset.act;
    if (a === 'undo') this.undo(); if (a === 'redo') this.redo(); if (a === 'walk') this.startWalking();
    if (a === 'reset' && confirm(`Throw away your edits to ${this.def.name}?`)) { delete this.drafts[this.id]; this.open(this.id); this.rebuild(); this.refreshPanel(); }
    if (a === 'delete') { const i = this.sel.i; this.sel = null; this.change(d => d.buildings.splice(i, 1)); }
    if (a === 'nowall') { const i = this.sel.i; this.change(d => { delete d.buildings[i].wall; }); }
    if (a === 'night') { this.night = !this.night; this.rebuild(); this.refreshPanel(); }
    if (a === 'post') { this.post = !this.post; this.rebuild(); this.refreshPanel(); }
    if (a === 'mod') { this.download('towns.json', this.modJson()); this.show(this.modJson()); }
    if (a === 'entry') { const txt = this.entryJson(); this.show(txt); try { navigator.clipboard.writeText(txt); toast('Copied'); } catch (err) { } }
  },
  show(text) { const o = this.panel.querySelector('#ed-out'); o.style.display = 'block'; o.value = text; o.select(); },
};

const EditorScene = {
  t: 0,
  update(dt) { this.t += dt; Field.t = (Field.t || 0) + dt; if (Editor.flash) { Editor.flash.t -= dt; if (Editor.flash.t <= 0) Editor.flash = null; } },
  draw(g) {
    const E = Editor, m = E.map;
    Field.map = m; Field.camAt = { x: Math.round(E.cam.x), y: Math.round(E.cam.y) }; Field.noPlayer = true; Field.banner = null; Field.anim = null;
    Field.draw(g);
    const cx = Field.camAt.x, cy = Field.camAt.y, sx = x => x * TS - cx, sy = y => y * TS - cy;
    g.save();
    // a faint grid, the exits, the doors
    g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 1;
    for (let x = 0; x <= m.w; x++) { g.beginPath(); g.moveTo(sx(x), sy(0)); g.lineTo(sx(x), sy(m.h)); g.stroke(); }
    for (let y = 0; y <= m.h; y++) { g.beginPath(); g.moveTo(sx(0), sy(y)); g.lineTo(sx(m.w), sy(y)); g.stroke(); }
    g.strokeStyle = '#7aff9a'; g.lineWidth = 2;
    for (const [x, y] of E.def.exits) g.strokeRect(sx(x) + 2, sy(y) + 2, TS - 4, TS - 4);
    for (const b of E.def.buildings) { const dx = b.x + Math.floor(b.w / 2); g.strokeStyle = 'rgba(255,210,122,.8)'; g.setLineDash([3, 3]); g.strokeRect(sx(dx) + 4, sy(b.y + b.h) + 4, TS - 8, TS - 8); g.setLineDash([]); }
    // the selection
    const s = E.sel;
    if (s) {
      g.strokeStyle = '#ffd27a'; g.lineWidth = 2.5;
      if (s.type === 'building') { const b = E.def.buildings[s.i]; if (b) g.strokeRect(sx(b.x), sy(b.y), b.w * TS, b.h * TS); }
      if (s.type === 'decor') { const dd = E.def.decor[s.i]; if (dd) g.strokeRect(sx(dd[0]), sy(dd[1]), TS, TS); }
      if (s.type === 'exit') { const ee = E.def.exits[s.i]; if (ee) g.strokeRect(sx(ee[0]), sy(ee[1]), TS, TS); }
    }
    // the rectangle being dragged
    const dr = E.drag;
    if (dr && dr.rect) {
      const x = Math.min(dr.x0, dr.x1), y = Math.min(dr.y0, dr.y1), w = Math.abs(dr.x1 - dr.x0) + 1, h = Math.abs(dr.y1 - dr.y0) + 1;
      g.fillStyle = { building: 'rgba(255,210,122,.25)', path: 'rgba(220,190,140,.35)', water: 'rgba(80,160,255,.35)', pier: 'rgba(170,120,70,.4)' }[E.tool] || 'rgba(255,255,255,.2)';
      g.fillRect(sx(x), sy(y), w * TS, h * TS); g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.strokeRect(sx(x), sy(y), w * TS, h * TS);
      text(g, `${w} × ${h}`, sx(x) + 4, sy(y) + 4, { size: 12, color: '#fff' });
    }
    // problems
    for (const p of E.problems) { g.strokeStyle = '#ff5a4a'; g.lineWidth = 2.5; g.beginPath(); g.arc(sx(p.x) + TS / 2, sy(p.y) + TS / 2, 13, 0, Math.PI * 2); g.stroke(); }
    if (E.flash) { g.strokeStyle = `rgba(255,255,255,${Math.min(1, E.flash.t)})`; g.lineWidth = 3; g.beginPath(); g.arc(sx(E.flash.x) + TS / 2, sy(E.flash.y) + TS / 2, 20, 0, Math.PI * 2); g.stroke(); }
    // the tile under the mouse
    const hv = E.hover;
    if (hv && !dr) {
      g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 1.5; g.strokeRect(sx(hv.x), sy(hv.y), TS, TS);
      const bi = E.buildingAt(hv.x, hv.y), tile = m.at(hv.x, hv.y);
      text(g, `${hv.x}, ${hv.y}${bi >= 0 ? '  ' + E.def.buildings[bi].id : tile && TOWN_DECOR[tile] ? '  ' + TOWN_DECOR[tile] : ''}`, 8, H - 20, { size: 12, color: '#fff' });
    }
    g.restore();
  },
};

async function oldDoorEvent(townId, b) {
  if (b.kind === 'inn') return innStay(townId, b.price);
